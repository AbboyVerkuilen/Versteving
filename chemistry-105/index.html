<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Under Pressure · Chemistry 105</title>
<meta name="description" content="A crisp packet puffs up on a mountain. Tea brews badly on Everest. Salt melts ice on a frozen road. A mystery about invisible pushing, and the restless particles behind it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='6' fill='%23f4c35a'/%3E%3Cellipse cx='32' cy='32' rx='28' ry='10' fill='none' stroke='%235ce1e6' stroke-width='3'/%3E%3Cellipse cx='32' cy='32' rx='28' ry='10' fill='none' stroke='%235ce1e6' stroke-width='3' transform='rotate(60 32 32)'/%3E%3Cellipse cx='32' cy='32' rx='28' ry='10' fill='none' stroke='%235ce1e6' stroke-width='3' transform='rotate(120 32 32)'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#07080f; --bg2:#0b0d19; --panel:#10132a; --panel2:#151937; --panel3:#1b2044;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15);
  --text:#eeedf7; --soft:#c9c8dc; --muted:#8f8eab;
  --gold:#f4c35a; --gold2:#ffdf9a; --cyan:#5ce1e6; --pink:#ff6b9a; --green:#6fe3a0;
  --violet:#a78bfa; --red:#ff5d5d; --blue:#6b8cff; --orange:#ff9f5a;
  --r:20px; --r-sm:12px;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow:0 30px 80px -30px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.7;overflow-x:hidden;
  background-image:radial-gradient(1200px 800px at 85% -10%,rgba(92,225,230,.07),transparent 60%),radial-gradient(900px 700px at -10% 30%,rgba(167,139,250,.06),transparent 60%);}
::selection{background:rgba(244,195,90,.35)}
a{color:var(--cyan)}
img,svg,canvas{display:block;max-width:100%}
button{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--display);font-weight:500;letter-spacing:-.01em;line-height:1.12;margin:0}
p{margin:0 0 1.1em}
em{font-style:italic;color:var(--gold2)}
.mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
.topbar{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;gap:16px;padding:12px 22px;
  background:linear-gradient(to bottom,rgba(7,8,15,.92),rgba(7,8,15,.6));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-family:var(--display);font-size:19px;white-space:nowrap}
.brand svg{width:26px;height:26px}
.brand i{font-style:italic;color:var(--gold)}
.topbar .spacer{flex:1}
.evidence-pill{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 8px;border:1px solid var(--line2);border-radius:999px;font-size:13px;color:var(--soft);text-decoration:none;background:rgba(255,255,255,.03)}
.evidence-pill .dots{display:flex;gap:4px}
.evidence-pill .dots span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.12);transition:.4s}
.evidence-pill .dots span.on{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.tb-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--line2);background:transparent;text-decoration:none;color:var(--text);font-size:13px;font-weight:500;cursor:pointer;transition:.2s;white-space:nowrap}
.tb-btn:hover{border-color:var(--gold);color:var(--gold)}
.tb-btn .badge{background:var(--gold);color:#1a1300;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
.progress{position:fixed;left:0;top:0;height:2px;background:linear-gradient(90deg,var(--cyan),var(--gold),var(--pink));z-index:60;width:0}

/* ---------- rail ---------- */
.rail{position:fixed;left:18px;top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;gap:6px}
.rail a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--muted);font-size:12px;font-family:var(--mono);height:22px}
.rail a b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);font-weight:400;font-size:10px;transition:.3s;background:var(--bg)}
.rail a span{opacity:0;transform:translateX(-6px);transition:.25s;white-space:nowrap;background:var(--panel);padding:2px 8px;border-radius:6px;border:1px solid var(--line)}
.rail a:hover span,.rail a.active span{opacity:1;transform:none}
.rail a.active b{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 0 4px rgba(92,225,230,.12)}
.rail a.solved b{background:var(--gold);color:#1a1300;border-color:var(--gold)}
@media (max-width:1180px){.rail{display:none}}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100vh;min-height:100svh;display:grid;place-items:center;text-align:center;overflow:hidden;padding:110px 20px 80px}
#hero-canvas{position:absolute;inset:0;width:100%;height:100%}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:200px;background:linear-gradient(transparent,var(--bg));pointer-events:none}
.hero-inner{position:relative;z-index:2;max-width:900px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
.hero h1{font-size:clamp(48px,9vw,124px);font-weight:300;margin:22px 0 18px;letter-spacing:-.03em}
.hero h1 em{font-weight:500;background:linear-gradient(100deg,var(--gold2),var(--gold) 40%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.08em}
.hero .lede{font-size:clamp(17px,2vw,21px);color:var(--soft);max-width:640px;margin:0 auto 34px}
.cta-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:13px 22px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--text);text-decoration:none;font-weight:600;font-size:15px;cursor:pointer;transition:transform .2s,background .2s,border-color .2s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#ffd77c,var(--gold));color:#1a1300;border-color:transparent;box-shadow:0 10px 30px -8px rgba(244,195,90,.6)}
.btn.primary:hover{box-shadow:0 14px 40px -8px rgba(244,195,90,.8)}
.btn.small{padding:8px 14px;font-size:13px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.btn.on{border-color:var(--cyan);color:var(--cyan);background:rgba(92,225,230,.08)}
.scroll-hint{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:3;font-family:var(--mono);font-size:11px;letter-spacing:.25em;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.scroll-hint i{width:1px;height:40px;background:linear-gradient(var(--gold),transparent);animation:drip 2s infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* ---------- layout ---------- */
main{position:relative}
.wrap{max-width:1120px;margin:0 auto;padding:0 28px}
.narrow{max-width:760px}
section.chapter{padding:120px 0 60px;position:relative}
section.chapter + section.chapter::before{content:"";position:absolute;top:0;left:50%;width:1px;height:80px;background:linear-gradient(transparent,var(--line2),transparent)}
@media (max-width:640px){.wrap{padding:0 16px}section.chapter{padding:84px 0 40px}body{font-size:16px}}

.case-head{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:end;margin-bottom:46px}
.case-num{font-family:var(--display);line-height:.8}
.case-num span{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.case-num b{font-weight:300;font-size:clamp(90px,14vw,170px);color:transparent;-webkit-text-stroke:1px rgba(244,195,90,.55);letter-spacing:-.04em}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--cyan);margin-bottom:14px}
.case-head h2{font-size:clamp(34px,5.4vw,62px);font-weight:400}
.case-head h2 em{font-weight:500}
@media (max-width:640px){.case-head{grid-template-columns:1fr;gap:8px}.case-num b{font-size:84px}}

.story{font-size:18.5px;color:var(--soft);max-width:760px}
.story p:first-of-type::first-letter{font-family:var(--display);font-size:3.4em;float:left;line-height:.9;padding:6px 10px 0 0;color:var(--gold)}
.story strong{color:var(--text);font-weight:600}
.story .aside{font-size:15px;color:var(--muted);border-left:2px solid var(--line2);padding-left:16px}
@media (max-width:640px){.story{font-size:17px}}

/* ---------- characters ---------- */
.avatar{display:inline-block;vertical-align:middle;flex:none;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
.cast{display:flex;flex-wrap:wrap;gap:14px;margin:34px 0}
.cast-card{display:flex;gap:14px;align-items:center;padding:12px 18px 12px 12px;border:1px solid var(--line);border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01))}
.cast-card b{display:block;font-family:var(--display);font-size:18px;font-weight:500;line-height:1.2}
.cast-card small{color:var(--muted);font-size:12.5px;line-height:1.3;display:block}
.dialogue{margin:28px 0;display:flex;flex-direction:column;gap:14px;max-width:760px}
.line{display:flex;gap:14px;align-items:flex-start}
.line.right{flex-direction:row-reverse;text-align:left}
.bubble{position:relative;background:var(--panel2);border:1px solid var(--line);padding:12px 18px;border-radius:18px;font-size:16px;color:var(--soft);max-width:560px}
.line:not(.right) .bubble{border-top-left-radius:4px}
.line.right .bubble{border-top-right-radius:4px}
.bubble b{color:var(--text);font-weight:600;font-size:13px;display:block;font-family:var(--mono);letter-spacing:.04em;margin-bottom:2px}
.narrator{font-style:italic;color:var(--muted);text-align:center;font-family:var(--display);font-size:17px}

/* ---------- mystery card ---------- */
.mystery{position:relative;margin:0 0 48px;padding:30px 32px;border-radius:var(--r);background:
  linear-gradient(135deg,rgba(244,195,90,.10),rgba(244,195,90,.02) 50%,rgba(255,107,154,.05)),var(--panel);border:1px solid rgba(244,195,90,.25);overflow:hidden}
.mystery::before{content:"?";position:absolute;right:-10px;top:-40px;font-family:var(--display);font-size:240px;line-height:1;color:rgba(244,195,90,.06);font-style:italic}
.mystery .tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.mystery .tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
.mystery h3{font-size:clamp(22px,2.8vw,30px);font-weight:400;max-width:780px;margin-bottom:18px;position:relative}
.hunches{display:flex;flex-wrap:wrap;gap:10px;position:relative}
.hunch{padding:10px 16px;border-radius:12px;border:1px solid var(--line2);background:rgba(0,0,0,.25);cursor:pointer;font-size:14.5px;text-align:left;transition:.2s}
.hunch:hover{border-color:var(--gold)}
.hunch.picked{border-color:var(--gold);background:rgba(244,195,90,.14);color:var(--gold2)}
.hunch:disabled{cursor:default}
.hunch-note{margin-top:14px;font-size:14px;color:var(--muted);min-height:1.4em;position:relative}

/* ---------- panels / labs ---------- */
.lab{margin:56px 0;border-radius:24px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;position:relative}
.lab::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(140deg,rgba(92,225,230,.35),transparent 30%,transparent 70%,rgba(244,195,90,.3));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.lab-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:18px 24px;border-bottom:1px solid var(--line)}
.lab-head h3{font-size:22px;font-weight:500}
.lab-head .label{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);display:block;margin-bottom:2px}
.lab-body{padding:24px}
.lab-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:24px}
@media (max-width:860px){.lab-grid{grid-template-columns:1fr}.lab-body{padding:16px}.lab-head{padding:16px}}
.stage{position:relative;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#12173a,#06070f 75%);border:1px solid var(--line)}
.stage canvas{width:100%;height:100%}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.hint{font-size:13.5px;color:var(--muted)}
.readout{font-family:var(--mono);font-size:13px;color:var(--soft)}
.readout b{color:var(--text);font-weight:600}
.side-panel{display:flex;flex-direction:column;gap:14px}
.info-card{border:1px solid var(--line);border-radius:16px;padding:18px;background:rgba(0,0,0,.2)}
.info-card h4{font-size:24px;margin-bottom:6px}
.info-card .meta{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--soft)}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:var(--track,linear-gradient(90deg,var(--blue),var(--cyan),var(--gold),var(--red)))}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:var(--track,linear-gradient(90deg,var(--blue),var(--cyan),var(--gold),var(--red)))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;margin-top:-8px;box-shadow:0 0 0 5px rgba(255,255,255,.12),0 4px 12px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 5px rgba(255,255,255,.12)}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 5px rgba(92,225,230,.5)}
.slider-row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.slider-row label{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:3px;background:rgba(0,0,0,.25);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-size:13px;cursor:pointer;color:var(--soft);font-weight:500}
.seg button.on{background:var(--text);color:#0a0b14}

/* ---------- lenses ---------- */
.lenses{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:56px 0}
.lens{padding:22px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.035),transparent);position:relative;overflow:hidden}
.lens .lt{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:12px}
.lens .lt svg{width:28px;height:28px;padding:5px;border-radius:9px;background:rgba(255,255,255,.06)}
.lens.macro .lt{color:var(--gold)} .lens.micro .lt{color:var(--cyan)} .lens.symbol .lt{color:var(--pink)}
.lens p{font-size:15px;color:var(--soft);margin:0}
.lens .formula{font-family:var(--mono);font-size:17px;color:var(--text);display:block;margin:6px 0 10px;padding:8px 12px;background:rgba(0,0,0,.3);border-radius:8px;border:1px solid var(--line);overflow-x:auto;white-space:nowrap}
@media (max-width:860px){.lenses{grid-template-columns:1fr}}

/* ---------- miracle ---------- */
.miracle{display:grid;grid-template-columns:140px 1fr;gap:26px;align-items:center;margin:56px 0;padding:28px;border-radius:24px;
  background:radial-gradient(500px 200px at 0% 0%,rgba(111,227,160,.12),transparent 70%),radial-gradient(500px 240px at 100% 100%,rgba(92,225,230,.08),transparent 70%),var(--panel);border:1px solid rgba(111,227,160,.22)}
.miracle .art{width:140px;height:140px}
.miracle .tag{font-family:var(--mono);font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--green);margin-bottom:8px;display:block}
.miracle h3{font-size:26px;margin-bottom:10px}
.miracle p{color:var(--soft);font-size:16px;margin-bottom:.6em}
.miracle p:last-child{margin:0}
@media (max-width:640px){.miracle{grid-template-columns:1fr;padding:20px}.miracle .art{width:100px;height:100px}}

/* ---------- practice blocks ---------- */
.practice{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:56px 0 30px}
@media (max-width:860px){.practice{grid-template-columns:1fr}}
.block{padding:24px;border-radius:20px;border:1px solid var(--line);background:var(--panel)}
.block .tag{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--violet);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.block h4{font-size:21px;margin-bottom:6px}
.block .why{font-size:13px;color:var(--muted);margin-bottom:16px}
.q{margin-bottom:20px}
.q:last-child{margin-bottom:0}
.q p.qt{font-weight:500;color:var(--text);margin-bottom:10px;font-size:16px;line-height:1.5}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:11px 14px;border-radius:12px;border:1px solid var(--line2);background:rgba(0,0,0,.2);cursor:pointer;font-size:14.5px;transition:.15s;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--violet);background:rgba(167,139,250,.08)}
.opt.right{border-color:var(--green);background:rgba(111,227,160,.12);color:#d8ffe8}
.opt.wrong{border-color:var(--red);background:rgba(255,93,93,.1);color:#ffd9d9;text-decoration:line-through;text-decoration-color:rgba(255,93,93,.6)}
.opt:disabled{cursor:default}
.fb{font-size:14px;margin-top:10px;padding:10px 14px;border-radius:10px;display:none;line-height:1.55}
.fb.show{display:block}
.fb.good{background:rgba(111,227,160,.08);color:#bff5d6;border:1px solid rgba(111,227,160,.25)}
.fb.bad{background:rgba(255,93,93,.07);color:#ffd2d2;border:1px solid rgba(255,93,93,.22)}
textarea{width:100%;min-height:120px;resize:vertical;background:rgba(0,0,0,.3);border:1px solid var(--line2);border-radius:12px;color:var(--text);padding:12px 14px;font:inherit;font-size:15px;line-height:1.6}
textarea:focus{outline:none;border-color:var(--violet)}
.model{display:none;margin-top:12px;padding:14px 16px;border-radius:12px;background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.25);font-size:14.5px;color:var(--soft)}
.model.show{display:block}
.saved{font-size:12px;color:var(--muted);font-family:var(--mono)}

.coldcase{margin:0 0 48px;padding:20px 24px;border-radius:18px;border:1px dashed rgba(92,225,230,.35);background:rgba(92,225,230,.04)}
.coldcase .tag{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);margin-bottom:8px;display:block}

/* ---------- verdict ---------- */
.verdict{margin:30px 0 0;border-radius:24px;border:1px solid var(--line2);overflow:hidden;background:var(--panel)}
.verdict-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:22px 26px}
.verdict-top .t{font-family:var(--display);font-size:24px}
.verdict-top .t small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}

      <p>Pressure is just collisions with the walls. Squeeze the volume and the hits come more often (Boyle). Heat the gas and every hit is harder, so it expands (Charles), all the way down to absolute zero, where the motion stops. Whether a substance is solid, liquid or gas depends on the contest between that motion and the pressure pushing down, which is why water boils cooler on Everest. And dissolved particles get in the way of freezing, which is why salt melts ice.</p>
      <p>Pressure (P), volume (V), amount (n), temperature (T), and one constant (R): the ideal gas law, written by Émile Clapeyron in 1834. Case closed.</p>`
  },
  cases: [
    {
      short: 'The Invisible Push', kicker: 'Gas pressure', titleHTML: 'The Invisible <em>Push</em>', item: 'The popping ears', ico: 'gauge', teaser: 'What is pushing?',
      clue: 'Gas pressure is the force of countless particles hitting a surface. More particles, or faster particles, means more pressure.',
      mystery: { q: 'Why do your ears "pop" when a plane takes off or lands?', h: ['The engine noise', 'The air pressure outside your eardrum changes, while the air trapped inside is at the old pressure', 'Your ears get cold'], a: 1, v: 'Behind each eardrum is a pocket of trapped air. As the plane climbs, fewer air molecules hit the outside of the drum each second, so the trapped air pushes the drum outwards. When a tube to your throat briefly opens (swallowing helps), air rushes through to balance the pressure: <b>pop</b>.' },
      story: `<p>Right now the air is pressing on every square centimetre of you with a force equal to about a kilogram’s weight. Over your whole body that comes to roughly <strong>15 tonnes</strong>. You don’t notice because the air inside you pushes back just as hard.</p>
        <p>In 1654 the mayor of Magdeburg, <strong>Otto von Guericke</strong>, made the invisible push visible. He fitted two copper hemispheres together and pumped the air out from inside. Then he hitched two teams of horses to pull them apart, and they couldn’t. Nothing held the hemispheres together but the pressure of the air outside.</p>
        <p>What <em>is</em> that pressure? Gas particles are flying around at hundreds of metres per second. Every time one bounces off a surface, it gives a tiny shove. Add up billions of billions of shoves each second and you get a steady push: <strong>pressure = force ÷ area</strong>. More particles, or faster particles, mean more pushing.</p>`,

      clue: 'At constant temperature, squeezing a gas into half the volume doubles its pressure: P × V stays constant (Boyle’s law).',
      mystery: { q: 'Why must a scuba diver never hold their breath while swimming up from 20 metres down?', h: ['The water gets colder', 'As the water pressure drops, the air in their lungs expands, and can tear the lungs', 'They would run out of oxygen'], a: 1, v: 'At 20 m deep, the pressure is 3 atmospheres, so the air in the diver’s lungs is squeezed to a third of its surface volume. Rising to the surface, the pressure falls to 1 atm and that air tries to expand <b>threefold</b> (Boyle’s law). Held in, it can over-inflate and rupture the lungs. Breathing out steadily lets it escape.' },
      story: `<p>In 1662 the Irish scientist <strong>Robert Boyle</strong> and his assistant Robert Hooke poured mercury into a J-shaped glass tube, trapping a pocket of air in the short, sealed end. Each time they added more mercury, they increased the pressure on the trapped air, and measured how much it shrank.</p>
        <p>The pattern was astonishingly clean: <strong>double the pressure, and the volume halves</strong>. Triple it, and the volume falls to a third. Pressure times volume stayed constant: <strong>P × V = constant</strong> (at fixed temperature).</p>
        <p>The particle picture makes it obvious. Squeeze the same particles into half the space and each one hits a wall twice as often, so the pressure doubles. Boyle’s law is why bubbles grow as they rise in a fizzy drink, why your lungs work like bellows, and why divers breathe out on the way up.</p>`,

            const k = pts.length ? pts.reduce((s, q) => s + q[0] * q[1], 0) / pts.length : 10; const curve = []; for (let v = 2; v <= 10.2; v += .1) curve.push([v, k / v]);

    {
      short: 'Charles’s Balloon', kicker: 'Temperature & volume', titleHTML: 'Charles’s <em>Balloon</em>', item: 'The freezer balloon', ico: 'balloon', teaser: 'Why does it shrink?',
      clue: 'At constant pressure, a gas’s volume is proportional to its absolute temperature (Charles’s law). Extrapolated, all gases reach zero volume at −273 °C: absolute zero.',
      mystery: { q: 'Put a blown-up balloon in the freezer for an hour and it comes out wrinkled and smaller. It warms up and swells back. Why?', h: ['Air leaks out in the cold and back in when warm', 'Cold particles move more slowly and hit the rubber less hard, so the balloon shrinks until pressures balance', 'The rubber shrinks in the cold'], a: 1, v: 'Nothing leaks. In the cold, the air molecules slow down and push less hard on the inside of the balloon, so the outside air squeezes it smaller. Warm them up and they speed up, push harder, and the balloon expands again. Volume is proportional to <b>absolute temperature</b>.' },
      story: `<p>On 1 December 1783, ten days after the first hot-air balloon flight, the French physicist <strong>Jacques Charles</strong> rose above Paris in a balloon filled with hydrogen and climbed to almost 3 kilometres. He was fascinated by how gases expand when heated, and he measured it.</p>
        <p>His finding: at constant pressure, every gas expands by the same fraction for each degree of warming, about 1/273 of its volume at 0 °C. Run the numbers backwards and something extraordinary appears. At <strong>−273 °C</strong>, every gas would shrink to <em>zero</em> volume. The particles would simply stop moving.</p>
        <p>In 1848 <strong>William Thomson</strong>, later Lord Kelvin, proposed a new temperature scale starting at this <strong>absolute zero</strong>: −273.15 °C = 0 K. On the kelvin scale, Charles’s law is beautifully simple: <strong>V ∝ T</strong>. Double the absolute temperature, double the volume.</p>`,

        body: `<div class="lab-grid"><div><div class="stage" style="height:300px"><canvas class="c" aria-label="Gas in a cylinder whose piston moves to keep pressure constant"></canvas></div><div class="slider-row" style="margin-top:14px"><label>Temperature</label><input type="range" class="t" min="80" max="600" value="300"><span class="readout"><b class="to"></b></span></div></div>

      miracle: { ico: 'balloon', title: 'Hot-air balloons fly on Charles’s law', html: '<p>The burner heats the air inside the envelope from about 20 °C to 100 °C, from 293 K to 373 K. By Charles’s law the air expands by 27%, and since the envelope is open at the bottom, the extra pours out. The air left inside is about a fifth lighter than the same volume of cool air outside.</p><p>A big balloon holds about 2,800 cubic metres, so that difference lifts around 700 kg: basket, burner, fuel and passengers.</p>', c1: '#ff9f5a', c2: '#ff5d5d' },

    {
      short: 'The Phase Map', kicker: 'Phase diagrams & boiling points', titleHTML: 'The Phase <em>Map</em>', item: 'The Everest tea', ico: 'mountain', teaser: 'Why won’t it brew?',
      clue: 'A liquid boils when its vapour pressure equals the surrounding pressure. Lower outside pressure means a lower boiling point; higher pressure, a higher one.',

      story: `<p>We tend to think of 100 °C as a fixed fact about water. It isn’t. It is the boiling point <em>at sea-level pressure</em>. Change the pressure and the boiling point moves.</p>
        <p>At any temperature, some molecules at the surface of a liquid are fast enough to escape, and those escaped molecules exert a <strong>vapour pressure</strong>. Heat the liquid and its vapour pressure rises. <strong>Boiling</strong> happens when the vapour pressure equals the pressure of the surroundings, so bubbles of vapour can form inside the liquid without being crushed.</p>
        <p>Chemists summarise this on a <strong>phase diagram</strong>, a map of pressure against temperature showing where a substance is solid, liquid or gas. Water’s map has two odd features: a <strong>triple point</strong> (0.01 °C, 0.006 atm) where ice, water and vapour coexist, and a melting line that tilts backwards, because ice is less dense than water.</p>`,
      lab: {

        init(root) {
          const R = 8.314, Hv = 40700, Hs = 51000, Tt = 273.16, Pt = .00604, Tc = 647, Pc = 218;
          const pVap = T => Math.exp(-Hv / R * (1 / T - 1 / 373.15)), pSub = T => Pt * Math.exp(-Hs / R * (1 / T - 1 / Tt));

          let T = 298, P = 1, note = PRE[0][3];
          $('.pre', root).innerHTML = PRE.map((p, i) => `<button data-i="${i}"><b>${p[0]}</b>${p[1]} °C · ${p[2]} atm</button>`).join('');
          $('.pre', root).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const p = PRE[+b.dataset.i]; T = p[1] + 273.15; P = p[2]; note = p[3]; $$('.pre button', root).forEach(x => x.classList.toggle('on', x === b)); draw(); });
          const c = $('.c', root); let M;
          function state(T, P) { if (T > Tc && P > Pc) return 'Supercritical'; if (T < Tt) return P > pSub(T) ? (T < tMelt(P) ? 'Solid (ice)' : 'Liquid') : 'Gas (vapour)'; if (T < tMelt(P) && P > Pt) return 'Solid (ice)'; return P > pVap(T) ? 'Liquid' : 'Gas (vapour)'; }
          function draw() {
            const lp = Math.log10; const vap = [], sub = [], mel = [];
            for (let t = Tt; t <= Tc; t += 2) vap.push([t - 273.15, lp(pVap(t))]); for (let t = 200; t <= Tt; t += 1) sub.push([t - 273.15, lp(pSub(t))]); for (let q = -2.2; q <= 3.3; q += .1) mel.push([tMelt(Math.pow(10, q)) - 273.15, q]);
            M = plot(c, { x: [-75, 440], y: [-3.5, 3.4], xt: [-50, 0, 100, 200, 300, 400], xf: v => v + '°', yt: [-3, -2, -1, 0, 1, 2, 3], yf: v => (v === 0 ? '1' : '10' + String(v).split('').map(ch => ({ '-': '⁻', '1': '¹', '2': '²', '3': '³' })[ch] || ch).join('')), yl: 'pressure (atm, log)', xl: 'temperature (°C)', padL: 52,
              areas: [], series: [{ pts: vap, color: '#5ca8ff' }, { pts: sub, color: '#a78bfa' }, { pts: mel, color: '#6fe3a0' }], hlines: [{ y: 0, color: 'rgba(255,255,255,.3)', label: '1 atm' }], marks: [{ x: .01, y: lp(Pt), color: '#f4c35a', label: 'triple point', r: 4 }, { x: 374, y: lp(Pc), color: '#ff9f5a', label: 'critical point', r: 4 }, { x: T - 273.15, y: lp(P), color: '#fff', r: 7 }] });

      glow(ctx, ex, ey, 26, A[0], 1); ball(ctx, A[0], ex, ey, 5); ctx.restore();
    }

      if (p.x < -.05) p.x = 1.05; if (p.x > 1.05) p.x = -.05; if (p.y < -.05) p.y = 1.05; if (p.y > 1.05) p.y = -.05;
      p.sx = p.x * w; p.sy = p.y * h + Math.sin(t * .6 + p.ph) * 6 * p.z; const dx = p.sx - mx, dy = p.sy - my, d2 = dx * dx + dy * dy;

    for (const p of Pt) { ctx.globalAlpha = .35 + p.z * .6; ball(ctx, p.c, p.sx, p.sy, 2 + p.z * 6); } ctx.globalAlpha = 1;
  });
}
function finale() {

  const E = Array.from({ length: 90 }, () => ({ a: rnd() * TAU, r: .15 + rnd() * .85, s: (.05 + rnd() * .2) * (rnd() < .5 ? -1 : 1), tilt: rnd() * Math.PI }));
