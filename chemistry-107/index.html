<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Balance · Chemistry 107</title>
<meta name="description" content="One chemical reaction feeds half of humanity, and it never quite finishes. A mystery about how fast reactions run, why they stop, and how to push them where you want.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='6' fill='%23f4c35a'/%3E%3Cellipse cx='32' cy='32' rx='28' ry='10' fill='none' stroke='%235ce1e6' stroke-width='3'/%3E%3Cellipse cx='32' cy='32' rx='28' ry='10' fill='none' stroke='%235ce1e6' stroke-width='3' transform='rotate(60 32 32)'/%3E%3Cellipse cx='32' cy='32' rx='28' ry='10' fill='none' stroke='%235ce1e6' stroke-width='3' transform='rotate(120 32 32)'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#07080f; --bg2:#0b0d19; --panel:#10132a; --panel2:#151937; --panel3:#1b2044;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15);
  --text:#eeedf7; --soft:#c9c8dc; --muted:#8f8eab;
  --gold:#f4c35a; --gold2:#ffdf9a; --cyan:#5ce1e6; --pink:#ff6b9a; --green:#6fe3a0;
  --violet:#a78bfa; --red:#ff5d5d; --blue:#6b8cff; --orange:#ff9f5a;
  --r:20px; --r-sm:12px;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow:0 30px 80px -30px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.7;overflow-x:hidden;
  background-image:radial-gradient(1200px 800px at 85% -10%,rgba(92,225,230,.07),transparent 60%),radial-gradient(900px 700px at -10% 30%,rgba(167,139,250,.06),transparent 60%);}
::selection{background:rgba(244,195,90,.35)}
a{color:var(--cyan)}
img,svg,canvas{display:block;max-width:100%}
button{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--display);font-weight:500;letter-spacing:-.01em;line-height:1.12;margin:0}
p{margin:0 0 1.1em}
em{font-style:italic;color:var(--gold2)}
.mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
.topbar{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;gap:16px;padding:12px 22px;
  background:linear-gradient(to bottom,rgba(7,8,15,.92),rgba(7,8,15,.6));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-family:var(--display);font-size:19px;white-space:nowrap}
.brand svg{width:26px;height:26px}
.brand i{font-style:italic;color:var(--gold)}
.topbar .spacer{flex:1}
.evidence-pill{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 8px;border:1px solid var(--line2);border-radius:999px;font-size:13px;color:var(--soft);text-decoration:none;background:rgba(255,255,255,.03)}
.evidence-pill .dots{display:flex;gap:4px}
.evidence-pill .dots span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.12);transition:.4s}
.evidence-pill .dots span.on{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.tb-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--line2);background:transparent;text-decoration:none;color:var(--text);font-size:13px;font-weight:500;cursor:pointer;transition:.2s;white-space:nowrap}
.tb-btn:hover{border-color:var(--gold);color:var(--gold)}
.tb-btn .badge{background:var(--gold);color:#1a1300;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
.progress{position:fixed;left:0;top:0;height:2px;background:linear-gradient(90deg,var(--cyan),var(--gold),var(--pink));z-index:60;width:0}

/* ---------- rail ---------- */
.rail{position:fixed;left:18px;top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;gap:6px}
.rail a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--muted);font-size:12px;font-family:var(--mono);height:22px}
.rail a b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);font-weight:400;font-size:10px;transition:.3s;background:var(--bg)}
.rail a span{opacity:0;transform:translateX(-6px);transition:.25s;white-space:nowrap;background:var(--panel);padding:2px 8px;border-radius:6px;border:1px solid var(--line)}
.rail a:hover span,.rail a.active span{opacity:1;transform:none}
.rail a.active b{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 0 4px rgba(92,225,230,.12)}
.rail a.solved b{background:var(--gold);color:#1a1300;border-color:var(--gold)}
@media (max-width:1180px){.rail{display:none}}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100vh;min-height:100svh;display:grid;place-items:center;text-align:center;overflow:hidden;padding:110px 20px 80px}
#hero-canvas{position:absolute;inset:0;width:100%;height:100%}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:200px;background:linear-gradient(transparent,var(--bg));pointer-events:none}
.hero-inner{position:relative;z-index:2;max-width:900px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
.hero h1{font-size:clamp(48px,9vw,124px);font-weight:300;margin:22px 0 18px;letter-spacing:-.03em}
.hero h1 em{font-weight:500;background:linear-gradient(100deg,var(--gold2),var(--gold) 40%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.08em}
.hero .lede{font-size:clamp(17px,2vw,21px);color:var(--soft);max-width:640px;margin:0 auto 34px}
.cta-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:13px 22px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--text);text-decoration:none;font-weight:600;font-size:15px;cursor:pointer;transition:transform .2s,background .2s,border-color .2s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#ffd77c,var(--gold));color:#1a1300;border-color:transparent;box-shadow:0 10px 30px -8px rgba(244,195,90,.6)}
.btn.primary:hover{box-shadow:0 14px 40px -8px rgba(244,195,90,.8)}
.btn.small{padding:8px 14px;font-size:13px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.btn.on{border-color:var(--cyan);color:var(--cyan);background:rgba(92,225,230,.08)}
.scroll-hint{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:3;font-family:var(--mono);font-size:11px;letter-spacing:.25em;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.scroll-hint i{width:1px;height:40px;background:linear-gradient(var(--gold),transparent);animation:drip 2s infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* ---------- layout ---------- */
main{position:relative}
.wrap{max-width:1120px;margin:0 auto;padding:0 28px}
.narrow{max-width:760px}
section.chapter{padding:120px 0 60px;position:relative}
section.chapter + section.chapter::before{content:"";position:absolute;top:0;left:50%;width:1px;height:80px;background:linear-gradient(transparent,var(--line2),transparent)}
@media (max-width:640px){.wrap{padding:0 16px}section.chapter{padding:84px 0 40px}body{font-size:16px}}

.case-head{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:end;margin-bottom:46px}
.case-num{font-family:var(--display);line-height:.8}
.case-num span{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.case-num b{font-weight:300;font-size:clamp(90px,14vw,170px);color:transparent;-webkit-text-stroke:1px rgba(244,195,90,.55);letter-spacing:-.04em}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--cyan);margin-bottom:14px}
.case-head h2{font-size:clamp(34px,5.4vw,62px);font-weight:400}
.case-head h2 em{font-weight:500}
@media (max-width:640px){.case-head{grid-template-columns:1fr;gap:8px}.case-num b{font-size:84px}}

.story{font-size:18.5px;color:var(--soft);max-width:760px}
.story p:first-of-type::first-letter{font-family:var(--display);font-size:3.4em;float:left;line-height:.9;padding:6px 10px 0 0;color:var(--gold)}
.story strong{color:var(--text);font-weight:600}
.story .aside{font-size:15px;color:var(--muted);border-left:2px solid var(--line2);padding-left:16px}
@media (max-width:640px){.story{font-size:17px}}

/* ---------- characters ---------- */
.avatar{display:inline-block;vertical-align:middle;flex:none;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
.cast{display:flex;flex-wrap:wrap;gap:14px;margin:34px 0}
.cast-card{display:flex;gap:14px;align-items:center;padding:12px 18px 12px 12px;border:1px solid var(--line);border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01))}
.cast-card b{display:block;font-family:var(--display);font-size:18px;font-weight:500;line-height:1.2}
.cast-card small{color:var(--muted);font-size:12.5px;line-height:1.3;display:block}
.dialogue{margin:28px 0;display:flex;flex-direction:column;gap:14px;max-width:760px}
.line{display:flex;gap:14px;align-items:flex-start}
.line.right{flex-direction:row-reverse;text-align:left}
.bubble{position:relative;background:var(--panel2);border:1px solid var(--line);padding:12px 18px;border-radius:18px;font-size:16px;color:var(--soft);max-width:560px}
.line:not(.right) .bubble{border-top-left-radius:4px}
.line.right .bubble{border-top-right-radius:4px}
.bubble b{color:var(--text);font-weight:600;font-size:13px;display:block;font-family:var(--mono);letter-spacing:.04em;margin-bottom:2px}
.narrator{font-style:italic;color:var(--muted);text-align:center;font-family:var(--display);font-size:17px}

/* ---------- mystery card ---------- */
.mystery{position:relative;margin:0 0 48px;padding:30px 32px;border-radius:var(--r);background:
  linear-gradient(135deg,rgba(244,195,90,.10),rgba(244,195,90,.02) 50%,rgba(255,107,154,.05)),var(--panel);border:1px solid rgba(244,195,90,.25);overflow:hidden}
.mystery::before{content:"?";position:absolute;right:-10px;top:-40px;font-family:var(--display);font-size:240px;line-height:1;color:rgba(244,195,90,.06);font-style:italic}
.mystery .tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.mystery .tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
.mystery h3{font-size:clamp(22px,2.8vw,30px);font-weight:400;max-width:780px;margin-bottom:18px;position:relative}
.hunches{display:flex;flex-wrap:wrap;gap:10px;position:relative}
.hunch{padding:10px 16px;border-radius:12px;border:1px solid var(--line2);background:rgba(0,0,0,.25);cursor:pointer;font-size:14.5px;text-align:left;transition:.2s}
.hunch:hover{border-color:var(--gold)}
.hunch.picked{border-color:var(--gold);background:rgba(244,195,90,.14);color:var(--gold2)}
.hunch:disabled{cursor:default}
.hunch-note{margin-top:14px;font-size:14px;color:var(--muted);min-height:1.4em;position:relative}

/* ---------- panels / labs ---------- */
.lab{margin:56px 0;border-radius:24px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;position:relative}
.lab::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(140deg,rgba(92,225,230,.35),transparent 30%,transparent 70%,rgba(244,195,90,.3));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.lab-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:18px 24px;border-bottom:1px solid var(--line)}
.lab-head h3{font-size:22px;font-weight:500}
.lab-head .label{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);display:block;margin-bottom:2px}
.lab-body{padding:24px}
.lab-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:24px}
@media (max-width:860px){.lab-grid{grid-template-columns:1fr}.lab-body{padding:16px}.lab-head{padding:16px}}
.stage{position:relative;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#12173a,#06070f 75%);border:1px solid var(--line)}
.stage canvas{width:100%;height:100%}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.hint{font-size:13.5px;color:var(--muted)}
.readout{font-family:var(--mono);font-size:13px;color:var(--soft)}
.readout b{color:var(--text);font-weight:600}
.side-panel{display:flex;flex-direction:column;gap:14px}
.info-card{border:1px solid var(--line);border-radius:16px;padding:18px;background:rgba(0,0,0,.2)}
.info-card h4{font-size:24px;margin-bottom:6px}
.info-card .meta{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--soft)}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:var(--track,linear-gradient(90deg,var(--blue),var(--cyan),var(--gold),var(--red)))}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:var(--track,linear-gradient(90deg,var(--blue),var(--cyan),var(--gold),var(--red)))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;margin-top:-8px;box-shadow:0 0 0 5px rgba(255,255,255,.12),0 4px 12px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 5px rgba(255,255,255,.12)}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 5px rgba(92,225,230,.5)}
.slider-row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.slider-row label{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:3px;background:rgba(0,0,0,.25);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-size:13px;cursor:pointer;color:var(--soft);font-weight:500}
.seg button.on{background:var(--text);color:#0a0b14}

/* ---------- lenses ---------- */
.lenses{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:56px 0}
.lens{padding:22px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.035),transparent);position:relative;overflow:hidden}
.lens .lt{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:12px}
.lens .lt svg{width:28px;height:28px;padding:5px;border-radius:9px;background:rgba(255,255,255,.06)}
.lens.macro .lt{color:var(--gold)} .lens.micro .lt{color:var(--cyan)} .lens.symbol .lt{color:var(--pink)}
.lens p{font-size:15px;color:var(--soft);margin:0}
.lens .formula{font-family:var(--mono);font-size:17px;color:var(--text);display:block;margin:6px 0 10px;padding:8px 12px;background:rgba(0,0,0,.3);border-radius:8px;border:1px solid var(--line);overflow-x:auto;white-space:nowrap}
@media (max-width:860px){.lenses{grid-template-columns:1fr}}

/* ---------- miracle ---------- */
.miracle{display:grid;grid-template-columns:140px 1fr;gap:26px;align-items:center;margin:56px 0;padding:28px;border-radius:24px;
  background:radial-gradient(500px 200px at 0% 0%,rgba(111,227,160,.12),transparent 70%),radial-gradient(500px 240px at 100% 100%,rgba(92,225,230,.08),transparent 70%),var(--panel);border:1px solid rgba(111,227,160,.22)}
.miracle .art{width:140px;height:140px}
.miracle .tag{font-family:var(--mono);font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--green);margin-bottom:8px;display:block}
.miracle h3{font-size:26px;margin-bottom:10px}
.miracle p{color:var(--soft);font-size:16px;margin-bottom:.6em}
.miracle p:last-child{margin:0}
@media (max-width:640px){.miracle{grid-template-columns:1fr;padding:20px}.miracle .art{width:100px;height:100px}}

/* ---------- practice blocks ---------- */
.practice{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:56px 0 30px}
@media (max-width:860px){.practice{grid-template-columns:1fr}}
.block{padding:24px;border-radius:20px;border:1px solid var(--line);background:var(--panel)}
.block .tag{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--violet);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.block h4{font-size:21px;margin-bottom:6px}
.block .why{font-size:13px;color:var(--muted);margin-bottom:16px}
.q{margin-bottom:20px}
.q:last-child{margin-bottom:0}
.q p.qt{font-weight:500;color:var(--text);margin-bottom:10px;font-size:16px;line-height:1.5}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:11px 14px;border-radius:12px;border:1px solid var(--line2);background:rgba(0,0,0,.2);cursor:pointer;font-size:14.5px;transition:.15s;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--violet);background:rgba(167,139,250,.08)}
.opt.right{border-color:var(--green);background:rgba(111,227,160,.12);color:#d8ffe8}
.opt.wrong{border-color:var(--red);background:rgba(255,93,93,.1);color:#ffd9d9;text-decoration:line-through;text-decoration-color:rgba(255,93,93,.6)}
.opt:disabled{cursor:default}
.fb{font-size:14px;margin-top:10px;padding:10px 14px;border-radius:10px;display:none;line-height:1.55}
.fb.show{display:block}
.fb.good{background:rgba(111,227,160,.08);color:#bff5d6;border:1px solid rgba(111,227,160,.25)}
.fb.bad{background:rgba(255,93,93,.07);color:#ffd2d2;border:1px solid rgba(255,93,93,.22)}
textarea{width:100%;min-height:120px;resize:vertical;background:rgba(0,0,0,.3);border:1px solid var(--line2);border-radius:12px;color:var(--text);padding:12px 14px;font:inherit;font-size:15px;line-height:1.6}
textarea:focus{outline:none;border-color:var(--violet)}
.model{display:none;margin-top:12px;padding:14px 16px;border-radius:12px;background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.25);font-size:14.5px;color:var(--soft)}
.model.show{display:block}
.saved{font-size:12px;color:var(--muted);font-family:var(--mono)}

.coldcase{margin:0 0 48px;padding:20px 24px;border-radius:18px;border:1px dashed rgba(92,225,230,.35);background:rgba(92,225,230,.04)}
.coldcase .tag{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);margin-bottom:8px;display:block}

/* ---------- verdict ---------- */
.verdict{margin:30px 0 0;border-radius:24px;border:1px solid var(--line2);overflow:hidden;background:var(--panel)}
.verdict-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:22px 26px}
.verdict-top .t{font-family:var(--display);font-size:24px}
.verdict-top .t small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}

    html: `<p>Every reaction can run <strong>both forwards and backwards</strong>. As products build up, the reverse reaction speeds up, until the two rates are equal. From then on, nothing <em>seems</em> to change, yet molecules are reacting furiously in both directions.</p>
      <p>Rates depend on concentration and on how many collisions clear the activation-energy hill. Catalysts and enzymes lower that hill, speeding both directions equally. Where the balance settles is set by the equilibrium constant K, and when you disturb it by changing concentration, pressure or temperature, it shifts to oppose you (Le Chatelier).</p>
      <p>The Haber process is a deliberate compromise between <em>how much</em> and <em>how fast</em>, and it feeds half the world. Case closed.</p>`
  },
  cases: [
    {
      short: 'How Fast?', kicker: 'Reaction rates over time', titleHTML: 'How <em>Fast?</em>', item: 'The flat soda', ico: 'bottle', teaser: 'Fast then slow?',
      clue: 'The rate of a reaction depends on the concentration of reactants. As reactants are used up, the rate falls, so reactions slow down over time.',
      mystery: { q: 'A freshly opened bottle of soda fizzes furiously, then calms down, then goes flat very slowly over hours. Why does it slow down?', h: ['The bottle gets warmer', 'The rate depends on how much dissolved CO₂ is left; as it is used up, the rate falls', 'Bubbles block the opening'], a: 1, v: 'The speed of escape depends on the <b>concentration</b> of dissolved CO₂. At first there is lots, so the rate is high. As the gas escapes, there is less left to escape, so the rate falls. That gives a curve that drops steeply, then levels off: each equal stretch of time removes the same <i>fraction</i> of what remains.' },
      story: `<p>Chemistry isn’t only about <em>what</em> happens. It’s also about <em>how fast</em>. Iron rusts over years; dynamite explodes in microseconds; the browning of an apple takes minutes. The study of reaction speeds is called <strong>kinetics</strong>.</p>
        <p>The <strong>rate</strong> of a reaction is how quickly reactants disappear (or products appear), measured in moles per litre per second. In Chemistry 101 you met collision theory: particles must collide, hard enough. More particles in the same space means more collisions per second, so <strong>rate depends on concentration</strong>.</p>
        <p>That has a consequence. As a reaction proceeds, reactants are used up and their concentration falls, so the reaction <strong>slows down</strong>. For many reactions the rate is simply proportional to the concentration: <strong>rate = k[A]</strong>. Such "first-order" reactions have a constant <em>half-life</em>, just like radioactive decay: every half-life, half of what remains is gone.</p>`,
      lab: {

          <div class="side-panel"><div class="info-card"><canvas class="g" style="width:100%;height:200px" aria-label="Concentration against time"></canvas></div><div class="kv"><div><small>Left</small><b class="lf"></b></div><div><small>Current rate</small><b class="rt"></b></div><div><small>Half-life</small><b class="hl"></b></div></div></div></div>`,

            bg: (ctx, w, h, api) => { const f = api.count('a') / N0; ctx.fillStyle = `rgba(92,225,230,${.04 + f * .1})`; ctx.fillRect(0, 0, w, h); },
            onTick: (api, dt) => { acc += dt; if (acc > .25) { acc = 0; hist.push([api.S.t, api.count('a')]); if (hist.length > 400) hist.shift(); } } });

            plot($('.g', root), { x: [0, tm], y: [0, N0], xt: [0, Math.round(tm / 2), Math.round(tm)], yt: [0, N0 / 2, N0], yf: v => Math.round(v / N0 * 100) + '%', xl: 'time (s)', yl: '[CO₂] left', series: [{ pts: th, color: 'rgba(255,255,255,.3)', dash: [4, 4], width: 1.5 }, { pts: hist, color: '#5ce1e6' }], hlines: [{ y: N0 / 2, color: 'rgba(244,195,90,.6)', label: 'half' }] }); });

      lenses: ['A newly opened soda fizzes wildly at first, then gently for hours.', 'Fewer dissolved molecules left means fewer escape each second: the rate is proportional to concentration.', 'rate = k[A]', 'k is the rate constant; [A] is concentration in mol/L. First order: half-life t½ = 0.693 / k.'],
      miracle: { ico: 'heart', title: 'Your body clears caffeine by first-order kinetics', html: '<p>After a cup of coffee, your liver breaks caffeine down at a rate proportional to how much is in your blood. Its half-life is about <strong>5 hours</strong> in most adults. An afternoon espresso still leaves a quarter of its caffeine in you at bedtime, ten hours later.</p><p>Doctors use the same maths to decide how often to give medicines, so the concentration stays in the useful range between doses.</p>', c1: '#c98a5e', c2: '#5ce1e6' },
      quiz: [

    {
      short: 'The Energy Hill', kicker: 'Activation energy & temperature', titleHTML: 'The Energy <em>Hill</em>', item: 'The 10-degree rule', ico: 'thermo', teaser: 'Why double?',
      clue: 'Only particles with energy above the activation energy can react. Warming shifts the energy distribution, so the fraction above the hill grows dramatically.',
      mystery: { q: 'Raising the temperature by just 10 °C, from 20 to 30 °C, makes the particles only about 2% faster. Yet many reactions roughly double in speed. How?', h: ['Particles get bigger when hot', 'The number of particles with enough energy to clear the activation-energy hill roughly doubles', 'Heat acts as a catalyst'], a: 1, v: 'The average speed barely changes, but reactions depend on the rare particles in the <b>high-energy tail</b> of the distribution, those above the activation energy. That tail is extremely sensitive to temperature: a small warming can double the number of particles that make it over the hill.' },
      story: `<p>Even a perfect collision only leads to a reaction if the particles hit with enough energy to start breaking bonds. That minimum is the <strong>activation energy</strong>, E<sub>a</sub>: a hill every reaction must climb before it can roll down the other side.</p>
        <p>In a gas or liquid, particles don’t all have the same energy. James Clerk Maxwell and Ludwig Boltzmann worked out the spread in the 1860s and 70s: a hump of particles with middling energy, and a long tail of a few with much more. Only the tail beyond E<sub>a</sub> can react.</p>
        <p>In 1889 the Swede <strong>Svante Arrhenius</strong> (whom you met in 101) captured the effect in an equation: <strong>k = A e<sup>−Ea/RT</sup></strong>. Because temperature sits inside an exponential, small warmings have big effects. A <strong>catalyst</strong> doesn’t change the particles at all. It provides a different route with a lower hill, so far more of the existing particles can get over it.</p>`,
      lab: {
        label: 'Maxwell–Boltzmann explorer', title: 'Who has enough energy?',
        head: '<button class="btn small cat">Add catalyst</button>',
        body: `<div class="lab-grid"><div><div class="stage" style="height:320px;padding:6px"><canvas class="c" aria-label="Distribution of molecular energies with the activation energy marked"></canvas></div><div class="slider-row" style="margin-top:14px"><label>Temperature</label><input type="range" class="t" min="250" max="400" value="293"><span class="readout"><b class="to"></b></span></div><div class="slider-row"><label>Activation energy</label><input type="range" class="e" min="20" max="80" value="50" style="--track:linear-gradient(90deg,#3a3f66,#ff9f5a)"><span class="readout"><b class="eo"></b></span></div></div>
          <div class="side-panel"><div class="kv"><div><small>Fraction over the hill</small><b class="fr"></b></div><div><small>Rate vs 20 °C</small><b class="rr" style="color:var(--gold)"></b></div></div><div class="info-card"><p class="tx" style="margin:0;font-size:14.5px;color:var(--soft)"></p></div></div></div>`,
        init(root) {
          let T = 293, Ea = 50, cat = false; const R = 8.314e-3;
          const f = (E, T) => 2 * Math.sqrt(E / Math.PI) * Math.pow(1 / (R * T), 1.5) * Math.exp(-E / (R * T));
          const frac = (Ea, T) => { const x = Ea / (R * T); return 2 * Math.sqrt(x / Math.PI) * Math.exp(-x) + (1 - erf(Math.sqrt(x))); };
          function erf(x) { const t = 1 / (1 + .3275911 * x); return 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - .284496736) * t + .254829592) * t * Math.exp(-x * x); }
          function draw() { const ea = cat ? Ea * .6 : Ea, fr = frac(ea, T), fr0 = frac(Ea, 293);
            $('.to', root).textContent = `${T} K (${T - 273} °C)`; $('.eo', root).textContent = `${Ea} kJ/mol${cat ? ' → ' + ea.toFixed(0) : ''}`; $('.fr', root).innerHTML = fmt(fr * 100, 2) + ' %'; $('.rr', root).innerHTML = '×' + fmt(fr / fr0, fr / fr0 > 100 ? 0 : 2);
            const pts = [], pts2 = [], tail = []; let mx = 0; for (let E = 0; E <= 30; E += .2) { const v = f(E, T); pts.push([E, v]); mx = Math.max(mx, v); pts2.push([E, f(E, 293)]); }
            const tailMax = f(Math.max(ea, 0.1), T), mag = Math.pow(10, Math.max(0, Math.floor(Math.log10(mx * .35 / tailMax))));
            const E1 = Math.min(ea, 79), EmaxPlot = 80; for (let E = E1; E <= EmaxPlot; E += .5) tail.push([E, Math.min(mx * 1.1, f(E, T) * mag)]);
            const curve = []; for (let E = 0; E <= EmaxPlot; E += .5) curve.push([E, f(E, T)]);
            const P = plot($('.c', root), { x: [0, EmaxPlot], y: [0, mx * 1.15], xt: [0, 20, 40, 60, 80], yt: [], xl: 'energy of a collision (kJ/mol)', yl: 'number of particles', padL: 30,
              areas: [{ pts: tail, color: 'rgba(255,159,90,.45)' }], series: [{ pts: pts2.concat([[80, 0]]), color: 'rgba(255,255,255,.25)', dash: [4, 4], width: 1.2 }, { pts: curve, color: '#5ce1e6' }, { pts: tail, color: '#ff9f5a', width: 1.5 }],
              vlines: [{ x: ea, color: cat ? '#6fe3a0' : '#ff9f5a', label: (cat ? 'catalysed ' : '') + 'Eₐ' }].concat(cat ? [{ x: Ea, color: 'rgba(255,159,90,.5)', label: 'old Eₐ' }] : []) });
            label(P.ctx, `orange tail magnified ×10${String(Math.round(Math.log10(mag))).split('').map(d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[+d]).join('')}`, P.L + P.pw - 4, P.T + 28, { align: 'right', size: 10, color: '#ff9f5a' }); label(P.ctx, 'dashed: 20 °C', P.L + P.pw - 4, P.T + 42, { align: 'right', size: 10, color: '#8f8eab' });
            $('.tx', root).innerHTML = cat ? 'The catalyst offers a lower hill. Far more of the <i>same</i> particles now have enough energy, so the rate soars without heating.' : T > 300 ? `At ${T - 273} °C the hump shifts only slightly right, but the orange tail beyond the hill grows a lot. That tail is where reactions happen.` : 'Only collisions in the orange tail have enough energy to react. Warm things up and watch the tail.'; }
          slider($('.t', root), v => { T = v; draw(); }); slider($('.e', root), v => { Ea = v; draw(); });
          $('.cat', root).addEventListener('click', () => { cat = !cat; $('.cat', root).classList.toggle('on', cat); $('.cat', root).textContent = cat ? 'Catalyst added ✓' : 'Add catalyst'; draw(); });
          new ResizeObserver(draw).observe($('.c', root));
        }
      },
      lenses: ['Food keeps in the fridge; glow sticks blaze in hot water; a match needs a strike to light.', 'Only collisions with energy above Eₐ react. A slight warming greatly enlarges that high-energy minority.', 'k = A e<sup>−Eₐ/RT</sup>', 'The Arrhenius equation: rate constant k rises exponentially with temperature T.'],
      miracle: { ico: 'flame', title: 'Why a match needs a strike', html: '<p>A matchstick head and the air around it are a perfect mix of fuel and oxidiser, yet they sit in the box for years without reacting. The activation-energy hill is too high for room-temperature collisions.</p><p>Striking the match generates a burst of frictional heat, enough for a few molecules to clear the hill. Their reaction releases heat, which pushes more over the hill, and the flame runs away by itself. Exothermic reactions can supply their own activation energy once started.</p>', c1: '#ff9f5a', c2: '#ff5d5d' },

        { q: 'How does a catalyst speed up a reaction?', o: ['It heats the reactants', 'It provides a route with a lower activation energy', 'It increases the concentration', 'It is used up as fuel'], a: 1, w: 'A catalyst lowers the hill, so more existing collisions succeed. It isn’t consumed.' }

      prompt: { p: 'Explain why a small temperature rise can double a reaction rate, using the idea of an energy distribution.', m: 'Particles have a spread of energies: most are moderate, and a few in the tail have a lot. Only those above the activation energy can react. Warming slightly shifts the whole distribution to higher energies; the average hardly changes, but the number in the high-energy tail grows sharply, often doubling for a 10 °C rise. So twice as many collisions succeed.' }

    {
      short: 'Nature’s Catalysts', kicker: 'Enzymes & saturation', titleHTML: 'Nature’s <em>Catalysts</em>', item: 'The foaming wound', ico: 'gear', teaser: 'Why does it fizz?',
      clue: 'Enzymes are biological catalysts with active sites shaped for one substrate. Rate rises with substrate concentration until every enzyme is busy (saturation).',
      mystery: { q: 'Pour hydrogen peroxide on a cut and it foams instantly. In the bottle it barely changes for months. What’s different?', h: ['Blood is hot', 'An enzyme in your blood (catalase) breaks peroxide down millions of times faster', 'Air in the wound reacts with it'], a: 1, v: 'Your blood and cells contain <b>catalase</b>, one of the fastest enzymes known. Each molecule converts about <b>40 million</b> peroxide molecules into water and oxygen every second. The oxygen bubbles make the foam. Without the enzyme, the same reaction takes months.' },
      story: `<p>Almost every reaction in your body would be far too slow at 37 °C without help. That help comes from <strong>enzymes</strong>: protein catalysts, each folded into a precise 3D shape with a pocket called the <strong>active site</strong>.</p>
        <p>In 1894 <strong>Emil Fischer</strong> compared an enzyme and its target molecule (the <em>substrate</em>) to a <strong>lock and key</strong>: only the right shape fits. The substrate slips in, the enzyme holds it in a strained position that lowers the activation energy, the products pop out, and the enzyme is ready again, unchanged.</p>
        <p>In 1913 two scientists in Berlin, <strong>Maud Menten</strong> and <strong>Leonor Michaelis</strong>, measured how enzyme rates depend on substrate. At low concentration, more substrate means more reactions. But eventually every enzyme molecule is busy, and adding more substrate does nothing: the enzymes are <strong>saturated</strong>, like checkout tills on a busy Saturday.</p>`,
      lab: {
        label: 'Enzyme factory', title: 'Feed the enzymes',
        body: `<div class="lab-grid"><div><div class="stage" style="height:320px"><canvas class="c" aria-label="Enzymes binding substrates and releasing products"></canvas></div><div class="slider-row" style="margin-top:14px"><label>Substrate</label><input type="range" class="s" min="2" max="70" value="10" style="--track:linear-gradient(90deg,#3a3f66,#ff9f5a)"><span class="readout"><b class="so"></b></span></div></div>
          <div class="side-panel"><div class="info-card"><canvas class="g" style="width:100%;height:200px" aria-label="Reaction rate against substrate concentration"></canvas></div><div class="kv"><div><small>Enzymes busy</small><b class="bz"></b></div><div><small>Products / s</small><b class="rt"></b></div></div><p class="hint tx" style="font-size:13px">Points are recorded every few seconds. Try low, medium and high substrate.</p></div></div>`,
        init(root) {
          const c = $('.c', root); let nS = 10, S = [], prods = [], E = [], evts = [], pts = [], acc = 0;
          const mkS = (w, h) => ({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - .5) * 120, vy: (Math.random() - .5) * 120 });
          slider($('.s', root), v => { nS = v; $('.so', root).textContent = v + ' molecules'; evts = []; acc = 0; });
          animate(c, (dt, t) => { const { ctx, w, h } = fit(c); ctx.clearRect(0, 0, w, h);
            if (E.length === 0) for (let i = 0; i < 6; i++) E.push({ x: w * (.15 + (i % 3) * .35), y: h * (i < 3 ? .3 : .72), a: i * 1.3, busy: 0, sub: null });
            while (S.length < nS) S.push(mkS(w, h)); while (S.length > nS) S.pop();
            for (const s of S) { s.x += s.vx * dt; s.y += s.vy * dt; if (s.x < 0 || s.x > w) s.vx *= -1; if (s.y < 0 || s.y > h) s.vy *= -1; s.x = clamp(s.x, 0, w); s.y = clamp(s.y, 0, h); }
            for (const e of E) { const sx = e.x + Math.cos(e.a) * 30, sy = e.y + Math.sin(e.a) * 30;
              if (e.busy > 0) { e.busy -= dt; if (e.busy <= 0) { prods.push({ x: sx, y: sy, vx: Math.cos(e.a) * 140 + (Math.random() - .5) * 60, vy: Math.sin(e.a) * 140 + (Math.random() - .5) * 60, life: 1.6 }); evts.push(t); } }
              else for (let i = 0; i < S.length; i++) { const s = S[i]; if ((s.x - sx) ** 2 + (s.y - sy) ** 2 < 22 * 22) { e.busy = .9; S.splice(i, 1); S.push(mkS(w, h)); break; } }
              e.a += dt * .3;
              ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.a); const g = ctx.createRadialGradient(-8, -8, 2, 0, 0, 34); g.addColorStop(0, '#d9c8ff'); g.addColorStop(1, '#5b3aa0'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 32, .45, TAU - .45); ctx.lineTo(14, 0); ctx.closePath(); ctx.fill(); if (e.busy > 0) { ball(ctx, '#ff9f5a', 26, 0, 7); glow(ctx, 22, 0, 22, '#ffd36e', .6); } ctx.restore(); }
            for (const s of S) ball(ctx, '#ff9f5a', s.x, s.y, 6);
            for (const p of prods) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; ctx.globalAlpha = Math.max(0, p.life); ball(ctx, '#6fe3a0', p.x - 4, p.y, 4.5); ball(ctx, '#6fe3a0', p.x + 4, p.y + 3, 4.5); ctx.globalAlpha = 1; }
            prods = prods.filter(p => p.life > 0); evts = evts.filter(x => t - x < 4);
            const rate = evts.length / 4, busy = E.filter(e => e.busy > 0).length; $('.bz', root).textContent = `${busy} / ${E.length}`; $('.rt', root).textContent = rate.toFixed(1);
            acc += dt; if (acc > 4.5) { acc = 0; pts.push([nS, rate]); if (pts.length > 30) pts.shift(); }
            const vmax = 6 / .9, km = 14, th = []; for (let x = 0; x <= 72; x += 1) th.push([x, vmax * x / (km + x)]);
            plot($('.g', root), { x: [0, 72], y: [0, 8], xt: [0, 20, 40, 60], yt: [0, 2, 4, 6, 8], xl: 'substrate', yl: 'rate', series: [{ pts: th, color: 'rgba(167,139,250,.5)', dash: [4, 4], width: 1.5 }, { pts: pts.slice().sort((a, b) => a[0] - b[0]), color: '#ff9f5a', dots: true, width: 0 }], hlines: [{ y: vmax, color: 'rgba(255,255,255,.3)', label: 'max rate (all busy)' }], marks: [{ x: nS, y: rate, color: '#fff', r: 4 }] }); });
        }
      },
      lenses: ['Biological washing powder removes stains at 30 °C; pineapple stops jelly setting; peroxide foams on a cut.', 'Each enzyme binds its substrate in an active site shaped to fit, lowers the activation energy, releases products and repeats.', 'E + S ⇌ ES → E + P', 'Enzyme + substrate form a complex, which turns into product and releases the enzyme unchanged.'],

    {
      short: 'Both Ways at Once', kicker: 'Dynamic equilibrium & K', titleHTML: 'Both Ways at <em>Once</em>', item: 'The sealed fizzy bottle', ico: 'bottle', teaser: 'Why does it stay fizzy?',
      clue: 'Reversible reactions reach dynamic equilibrium: forward and backward rates become equal, so concentrations stop changing, even though reactions continue.',
      mystery: { q: 'An opened soda goes flat. But a sealed bottle stays fizzy for years. Isn’t the CO₂ still trying to escape from the liquid?', h: ['The cap pushes it back in', 'Yes: CO₂ escapes into the gap at the top, and returns to the liquid at exactly the same rate', 'CO₂ can’t move in a sealed bottle'], a: 1, v: 'In the sealed bottle, CO₂ molecules leave the liquid for the gas space, and gas molecules dissolve back in. Soon the two rates are equal: a <b>dynamic equilibrium</b>. Nothing seems to change, yet molecules swap places constantly. Open the cap, the gas escapes, the balance is broken, and more CO₂ leaves the liquid to replace it.' },
      story: `<p>Many reactions don’t simply run to completion. They are <strong>reversible</strong>: products can react to re-form reactants. Start with only reactants and the forward reaction is fast. As products build up, the reverse reaction speeds up. Eventually the two rates become <strong>equal</strong>.</p>
        <p>From then on the amounts stop changing. This is <strong>dynamic equilibrium</strong>: dynamic, because both reactions keep going at furious speed; equilibrium, because their effects cancel. It’s like an escalator on which you walk down exactly as fast as it carries you up.</p>
        <p>In 1864 two Norwegians, <strong>Cato Guldberg</strong> and <strong>Peter Waage</strong>, found that at equilibrium a particular ratio of concentrations is always the same at a given temperature: the <strong>equilibrium constant</strong>, K. For N₂O₄ ⇌ 2 NO₂, K = [NO₂]² / [N₂O₄]. Big K means mostly products; small K, mostly reactants.</p>`,

  $('#ev-count').textContent = solved.size;
  $('#ev-dots').innerHTML = CASES.map((_, i) => `<span class="${solved.has(i + 1) ? 'on' : ''}"></span>`).join('');
  $$('.ev').forEach(e => { const n = +e.dataset.n; e.classList.toggle('solved', solved.has(n)); e.querySelector('small').innerHTML = solved.has(n) ? CASES[n - 1].clue : CASES[n - 1].teaser + ' <span style="color:var(--gold)">Unsolved</span>'; });

function flashcards() {

  const st = i => deck[i] || { box: 1, due: 0 }, inF = i => filter === 'all' || CARDS[i][0] == filter;
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

    setTimeout(() => { $('#fc-q').innerHTML = C[1]; $('#fc-a').innerHTML = C[2]; }, card.dataset.was ? 250 : 0); card.dataset.was = 1;
    $('#fc-status').textContent = `${queue.length} card${queue.length > 1 ? 's' : ''} left in this session`;
  }
  function flip() { if (curr == null) return; card.classList.toggle('flipped'); if (card.classList.contains('flipped')) rate.classList.add('show'); }
  function grade(g) {

    deck[curr] = { box, due }; store.set('deck', deck); queue.shift(); if (g === 1) queue.splice(Math.min(queue.length, 3), 0, curr); next();

function interrogation() {

function hero() {
  const c = $('#hero-canvas'), rnd = seeded(+COURSE.id), A = COURSE.accent || ['#5ce1e6', '#f4c35a'];
  const cols = [A[0], A[1], '#ff6b9a', '#a78bfa', '#6fe3a0', '#dfe9ff'];
  const Pt = Array.from({ length: 64 }, (_, i) => ({ x: rnd(), y: rnd(), z: .25 + rnd() * .75, vx: (rnd() - .5) * .012, vy: (rnd() - .5) * .012, c: cols[i % cols.length], ph: rnd() * TAU }));
  let mx = -9999, my = -9999; const hs = $('.hero');
  hs.addEventListener('pointermove', e => { const r = c.getBoundingClientRect(); mx = e.clientX - r.left; my = e.clientY - r.top; });
  hs.addEventListener('pointerleave', () => { mx = my = -9999; });

    const { ctx, w, h } = fit(c); ctx.clearRect(0, 0, w, h);
    const cx = w * .5, cy = h * .47, R = Math.min(w * .46, h * .42);

      for (let j = 1; j < 18; j++) { const aj = a - j * .035; ctx.fillStyle = rgba(A[0], .25 * (1 - j / 18)); ctx.beginPath(); ctx.arc(Math.cos(aj) * R, Math.sin(aj) * R * .3, 3 * (1 - j / 22), 0, TAU); ctx.fill(); }
      glow(ctx, ex, ey, 26, A[0], 1); ball(ctx, A[0], ex, ey, 5); ctx.restore();
    }
    for (const p of Pt) {
      if (!reduceMotion) { p.x += p.vx * dt * p.z; p.y += p.vy * dt * p.z; }
      if (p.x < -.05) p.x = 1.05; if (p.x > 1.05) p.x = -.05; if (p.y < -.05) p.y = 1.05; if (p.y > 1.05) p.y = -.05;
      p.sx = p.x * w; p.sy = p.y * h + Math.sin(t * .6 + p.ph) * 6 * p.z; const dx = p.sx - mx, dy = p.sy - my, d2 = dx * dx + dy * dy;

    for (const p of Pt) { ctx.globalAlpha = .35 + p.z * .6; ball(ctx, p.c, p.sx, p.sy, 2 + p.z * 6); } ctx.globalAlpha = 1;
  });
}
function finale() {
  const c = $('#finale-canvas'), rnd = seeded(77), A = COURSE.accent || ['#5ce1e6'];
  const E = Array.from({ length: 90 }, () => ({ a: rnd() * TAU, r: .15 + rnd() * .85, s: (.05 + rnd() * .2) * (rnd() < .5 ? -1 : 1), tilt: rnd() * Math.PI }));

/* =========================================================
   ENGINES: particle box, plotter, 3D molecule viewer
   ========================================================= */
function ParticleBox(canvas, o) {

  function reset(counts) { S.P = []; S.t = 0; S.events = 0; for (const k in counts) add(k, counts[k], o.regions && o.regions[k]); }
  function setT(T) { const f = Math.sqrt(T / S.T); S.T = T; S.P.forEach(p => { p.vx *= f; p.vy *= f; }); }

  function step(dt) {
    const xmax = W * S.wall, mid = W * S.wall / 2;
    for (const p of S.P) {
      if (o.gravity) p.vy += o.gravity * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; const m = sp[p.k].m || 1;
      if (p.x < p.r) { p.x = p.r; S.imp += 2 * m * Math.abs(p.vx); p.vx = Math.abs(p.vx); }
      if (p.x > xmax - p.r) { p.x = xmax - p.r; S.imp += 2 * m * Math.abs(p.vx); p.vx = -Math.abs(p.vx); }
