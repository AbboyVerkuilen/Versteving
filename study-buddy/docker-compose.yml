# Study Buddy lokaal: `docker compose up --build` en open http://localhost:8000
services:
  app:
    build: .
    env_file:
      - path: .env
        required: false   # zonder .env start Study Buddy in testmodus
    environment:
      DATABASE_URL: postgresql+psycopg://studybuddy:studybuddy@db:5432/studybuddy
      SEARXNG_URL: http://searxng:8080
    volumes:
      - ./topics:/topics:ro          # lesstof: zet bestanden in topics/<onderwerp>/documenten/
    ports:
      - "127.0.0.1:8000:8000"        # alleen bereikbaar vanaf je eigen computer
    depends_on:
      db:
        condition: service_healthy
      searxng:
        condition: service_started
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: studybuddy
      POSTGRES_PASSWORD: studybuddy
      POSTGRES_DB: studybuddy
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studybuddy"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Zelf gehoste metazoekmachine voor web search: geen API-sleutel en geen kosten.
  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-verander-mij-in-iets-willekeurigs}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

volumes:
  dbdata:
