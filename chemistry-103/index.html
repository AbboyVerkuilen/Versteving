<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost Light · Chemistry 103</title>
<meta name="description" content="Why does every element glow its own colour? Why does sunlight burn but lamplight doesn’t? A mystery about light, the strange rules inside atoms, and a nucleus that can fall apart.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='6' fill='%23f4c35a'/%3E%3Cellipse cx='32' cy='32' rx='28' ry='10' fill='none' stroke='%235ce1e6' stroke-width='3'/%3E%3Cellipse cx='32' cy='32' rx='28' ry='10' fill='none' stroke='%235ce1e6' stroke-width='3' transform='rotate(60 32 32)'/%3E%3Cellipse cx='32' cy='32' rx='28' ry='10' fill='none' stroke='%235ce1e6' stroke-width='3' transform='rotate(120 32 32)'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#07080f; --bg2:#0b0d19; --panel:#10132a; --panel2:#151937; --panel3:#1b2044;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15);
  --text:#eeedf7; --soft:#c9c8dc; --muted:#8f8eab;
  --gold:#f4c35a; --gold2:#ffdf9a; --cyan:#5ce1e6; --pink:#ff6b9a; --green:#6fe3a0;
  --violet:#a78bfa; --red:#ff5d5d; --blue:#6b8cff; --orange:#ff9f5a;
  --r:20px; --r-sm:12px;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow:0 30px 80px -30px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.7;overflow-x:hidden;
  background-image:radial-gradient(1200px 800px at 85% -10%,rgba(92,225,230,.07),transparent 60%),radial-gradient(900px 700px at -10% 30%,rgba(167,139,250,.06),transparent 60%);}
::selection{background:rgba(244,195,90,.35)}
a{color:var(--cyan)}
img,svg,canvas{display:block;max-width:100%}
button{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--display);font-weight:500;letter-spacing:-.01em;line-height:1.12;margin:0}
p{margin:0 0 1.1em}
em{font-style:italic;color:var(--gold2)}
.mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
.topbar{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;gap:16px;padding:12px 22px;
  background:linear-gradient(to bottom,rgba(7,8,15,.92),rgba(7,8,15,.6));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-family:var(--display);font-size:19px;white-space:nowrap}
.brand svg{width:26px;height:26px}
.brand i{font-style:italic;color:var(--gold)}
.topbar .spacer{flex:1}
.evidence-pill{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 8px;border:1px solid var(--line2);border-radius:999px;font-size:13px;color:var(--soft);text-decoration:none;background:rgba(255,255,255,.03)}
.evidence-pill .dots{display:flex;gap:4px}
.evidence-pill .dots span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.12);transition:.4s}
.evidence-pill .dots span.on{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.tb-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--line2);background:transparent;text-decoration:none;color:var(--text);font-size:13px;font-weight:500;cursor:pointer;transition:.2s;white-space:nowrap}
.tb-btn:hover{border-color:var(--gold);color:var(--gold)}
.tb-btn .badge{background:var(--gold);color:#1a1300;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
.progress{position:fixed;left:0;top:0;height:2px;background:linear-gradient(90deg,var(--cyan),var(--gold),var(--pink));z-index:60;width:0}

/* ---------- rail ---------- */
.rail{position:fixed;left:18px;top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;gap:6px}
.rail a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--muted);font-size:12px;font-family:var(--mono);height:22px}
.rail a b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);font-weight:400;font-size:10px;transition:.3s;background:var(--bg)}
.rail a span{opacity:0;transform:translateX(-6px);transition:.25s;white-space:nowrap;background:var(--panel);padding:2px 8px;border-radius:6px;border:1px solid var(--line)}
.rail a:hover span,.rail a.active span{opacity:1;transform:none}
.rail a.active b{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 0 4px rgba(92,225,230,.12)}
.rail a.solved b{background:var(--gold);color:#1a1300;border-color:var(--gold)}
@media (max-width:1180px){.rail{display:none}}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100vh;min-height:100svh;display:grid;place-items:center;text-align:center;overflow:hidden;padding:110px 20px 80px}
#hero-canvas{position:absolute;inset:0;width:100%;height:100%}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:200px;background:linear-gradient(transparent,var(--bg));pointer-events:none}
.hero-inner{position:relative;z-index:2;max-width:900px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
.hero h1{font-size:clamp(48px,9vw,124px);font-weight:300;margin:22px 0 18px;letter-spacing:-.03em}
.hero h1 em{font-weight:500;background:linear-gradient(100deg,var(--gold2),var(--gold) 40%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.08em}
.hero .lede{font-size:clamp(17px,2vw,21px);color:var(--soft);max-width:640px;margin:0 auto 34px}
.cta-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:13px 22px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--text);text-decoration:none;font-weight:600;font-size:15px;cursor:pointer;transition:transform .2s,background .2s,border-color .2s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#ffd77c,var(--gold));color:#1a1300;border-color:transparent;box-shadow:0 10px 30px -8px rgba(244,195,90,.6)}
.btn.primary:hover{box-shadow:0 14px 40px -8px rgba(244,195,90,.8)}
.btn.small{padding:8px 14px;font-size:13px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.btn.on{border-color:var(--cyan);color:var(--cyan);background:rgba(92,225,230,.08)}
.scroll-hint{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:3;font-family:var(--mono);font-size:11px;letter-spacing:.25em;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.scroll-hint i{width:1px;height:40px;background:linear-gradient(var(--gold),transparent);animation:drip 2s infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* ---------- layout ---------- */
main{position:relative}
.wrap{max-width:1120px;margin:0 auto;padding:0 28px}
.narrow{max-width:760px}
section.chapter{padding:120px 0 60px;position:relative}
section.chapter + section.chapter::before{content:"";position:absolute;top:0;left:50%;width:1px;height:80px;background:linear-gradient(transparent,var(--line2),transparent)}
@media (max-width:640px){.wrap{padding:0 16px}section.chapter{padding:84px 0 40px}body{font-size:16px}}

.case-head{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:end;margin-bottom:46px}
.case-num{font-family:var(--display);line-height:.8}
.case-num span{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.case-num b{font-weight:300;font-size:clamp(90px,14vw,170px);color:transparent;-webkit-text-stroke:1px rgba(244,195,90,.55);letter-spacing:-.04em}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--cyan);margin-bottom:14px}
.case-head h2{font-size:clamp(34px,5.4vw,62px);font-weight:400}
.case-head h2 em{font-weight:500}
@media (max-width:640px){.case-head{grid-template-columns:1fr;gap:8px}.case-num b{font-size:84px}}

.story{font-size:18.5px;color:var(--soft);max-width:760px}
.story p:first-of-type::first-letter{font-family:var(--display);font-size:3.4em;float:left;line-height:.9;padding:6px 10px 0 0;color:var(--gold)}
.story strong{color:var(--text);font-weight:600}
.story .aside{font-size:15px;color:var(--muted);border-left:2px solid var(--line2);padding-left:16px}
@media (max-width:640px){.story{font-size:17px}}

/* ---------- characters ---------- */
.avatar{display:inline-block;vertical-align:middle;flex:none;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
.cast{display:flex;flex-wrap:wrap;gap:14px;margin:34px 0}
.cast-card{display:flex;gap:14px;align-items:center;padding:12px 18px 12px 12px;border:1px solid var(--line);border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01))}
.cast-card b{display:block;font-family:var(--display);font-size:18px;font-weight:500;line-height:1.2}
.cast-card small{color:var(--muted);font-size:12.5px;line-height:1.3;display:block}
.dialogue{margin:28px 0;display:flex;flex-direction:column;gap:14px;max-width:760px}
.line{display:flex;gap:14px;align-items:flex-start}
.line.right{flex-direction:row-reverse;text-align:left}
.bubble{position:relative;background:var(--panel2);border:1px solid var(--line);padding:12px 18px;border-radius:18px;font-size:16px;color:var(--soft);max-width:560px}
.line:not(.right) .bubble{border-top-left-radius:4px}
.line.right .bubble{border-top-right-radius:4px}
.bubble b{color:var(--text);font-weight:600;font-size:13px;display:block;font-family:var(--mono);letter-spacing:.04em;margin-bottom:2px}
.narrator{font-style:italic;color:var(--muted);text-align:center;font-family:var(--display);font-size:17px}

/* ---------- mystery card ---------- */
.mystery{position:relative;margin:0 0 48px;padding:30px 32px;border-radius:var(--r);background:
  linear-gradient(135deg,rgba(244,195,90,.10),rgba(244,195,90,.02) 50%,rgba(255,107,154,.05)),var(--panel);border:1px solid rgba(244,195,90,.25);overflow:hidden}
.mystery::before{content:"?";position:absolute;right:-10px;top:-40px;font-family:var(--display);font-size:240px;line-height:1;color:rgba(244,195,90,.06);font-style:italic}
.mystery .tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.mystery .tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
.mystery h3{font-size:clamp(22px,2.8vw,30px);font-weight:400;max-width:780px;margin-bottom:18px;position:relative}
.hunches{display:flex;flex-wrap:wrap;gap:10px;position:relative}
.hunch{padding:10px 16px;border-radius:12px;border:1px solid var(--line2);background:rgba(0,0,0,.25);cursor:pointer;font-size:14.5px;text-align:left;transition:.2s}
.hunch:hover{border-color:var(--gold)}
.hunch.picked{border-color:var(--gold);background:rgba(244,195,90,.14);color:var(--gold2)}
.hunch:disabled{cursor:default}
.hunch-note{margin-top:14px;font-size:14px;color:var(--muted);min-height:1.4em;position:relative}

/* ---------- panels / labs ---------- */
.lab{margin:56px 0;border-radius:24px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;position:relative}
.lab::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(140deg,rgba(92,225,230,.35),transparent 30%,transparent 70%,rgba(244,195,90,.3));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.lab-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:18px 24px;border-bottom:1px solid var(--line)}
.lab-head h3{font-size:22px;font-weight:500}
.lab-head .label{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);display:block;margin-bottom:2px}
.lab-body{padding:24px}
.lab-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:24px}
@media (max-width:860px){.lab-grid{grid-template-columns:1fr}.lab-body{padding:16px}.lab-head{padding:16px}}
.stage{position:relative;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#12173a,#06070f 75%);border:1px solid var(--line)}
.stage canvas{width:100%;height:100%}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.hint{font-size:13.5px;color:var(--muted)}
.readout{font-family:var(--mono);font-size:13px;color:var(--soft)}
.readout b{color:var(--text);font-weight:600}
.side-panel{display:flex;flex-direction:column;gap:14px}
.info-card{border:1px solid var(--line);border-radius:16px;padding:18px;background:rgba(0,0,0,.2)}
.info-card h4{font-size:24px;margin-bottom:6px}
.info-card .meta{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--soft)}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:var(--track,linear-gradient(90deg,var(--blue),var(--cyan),var(--gold),var(--red)))}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:var(--track,linear-gradient(90deg,var(--blue),var(--cyan),var(--gold),var(--red)))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;margin-top:-8px;box-shadow:0 0 0 5px rgba(255,255,255,.12),0 4px 12px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 5px rgba(255,255,255,.12)}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 5px rgba(92,225,230,.5)}
.slider-row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.slider-row label{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:3px;background:rgba(0,0,0,.25);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-size:13px;cursor:pointer;color:var(--soft);font-weight:500}
.seg button.on{background:var(--text);color:#0a0b14}

/* ---------- lenses ---------- */
.lenses{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:56px 0}
.lens{padding:22px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.035),transparent);position:relative;overflow:hidden}
.lens .lt{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:12px}
.lens .lt svg{width:28px;height:28px;padding:5px;border-radius:9px;background:rgba(255,255,255,.06)}
.lens.macro .lt{color:var(--gold)} .lens.micro .lt{color:var(--cyan)} .lens.symbol .lt{color:var(--pink)}
.lens p{font-size:15px;color:var(--soft);margin:0}
.lens .formula{font-family:var(--mono);font-size:17px;color:var(--text);display:block;margin:6px 0 10px;padding:8px 12px;background:rgba(0,0,0,.3);border-radius:8px;border:1px solid var(--line);overflow-x:auto;white-space:nowrap}
@media (max-width:860px){.lenses{grid-template-columns:1fr}}

/* ---------- miracle ---------- */
.miracle{display:grid;grid-template-columns:140px 1fr;gap:26px;align-items:center;margin:56px 0;padding:28px;border-radius:24px;
  background:radial-gradient(500px 200px at 0% 0%,rgba(111,227,160,.12),transparent 70%),radial-gradient(500px 240px at 100% 100%,rgba(92,225,230,.08),transparent 70%),var(--panel);border:1px solid rgba(111,227,160,.22)}
.miracle .art{width:140px;height:140px}
.miracle .tag{font-family:var(--mono);font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--green);margin-bottom:8px;display:block}
.miracle h3{font-size:26px;margin-bottom:10px}
.miracle p{color:var(--soft);font-size:16px;margin-bottom:.6em}
.miracle p:last-child{margin:0}
@media (max-width:640px){.miracle{grid-template-columns:1fr;padding:20px}.miracle .art{width:100px;height:100px}}

/* ---------- practice blocks ---------- */
.practice{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:56px 0 30px}
@media (max-width:860px){.practice{grid-template-columns:1fr}}
.block{padding:24px;border-radius:20px;border:1px solid var(--line);background:var(--panel)}
.block .tag{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--violet);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.block h4{font-size:21px;margin-bottom:6px}
.block .why{font-size:13px;color:var(--muted);margin-bottom:16px}
.q{margin-bottom:20px}
.q:last-child{margin-bottom:0}
.q p.qt{font-weight:500;color:var(--text);margin-bottom:10px;font-size:16px;line-height:1.5}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:11px 14px;border-radius:12px;border:1px solid var(--line2);background:rgba(0,0,0,.2);cursor:pointer;font-size:14.5px;transition:.15s;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--violet);background:rgba(167,139,250,.08)}
.opt.right{border-color:var(--green);background:rgba(111,227,160,.12);color:#d8ffe8}
.opt.wrong{border-color:var(--red);background:rgba(255,93,93,.1);color:#ffd9d9;text-decoration:line-through;text-decoration-color:rgba(255,93,93,.6)}
.opt:disabled{cursor:default}
.fb{font-size:14px;margin-top:10px;padding:10px 14px;border-radius:10px;display:none;line-height:1.55}
.fb.show{display:block}
.fb.good{background:rgba(111,227,160,.08);color:#bff5d6;border:1px solid rgba(111,227,160,.25)}
.fb.bad{background:rgba(255,93,93,.07);color:#ffd2d2;border:1px solid rgba(255,93,93,.22)}
textarea{width:100%;min-height:120px;resize:vertical;background:rgba(0,0,0,.3);border:1px solid var(--line2);border-radius:12px;color:var(--text);padding:12px 14px;font:inherit;font-size:15px;line-height:1.6}
textarea:focus{outline:none;border-color:var(--violet)}
.model{display:none;margin-top:12px;padding:14px 16px;border-radius:12px;background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.25);font-size:14.5px;color:var(--soft)}
.model.show{display:block}
.saved{font-size:12px;color:var(--muted);font-family:var(--mono)}

.coldcase{margin:0 0 48px;padding:20px 24px;border-radius:18px;border:1px dashed rgba(92,225,230,.35);background:rgba(92,225,230,.04)}
.coldcase .tag{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);margin-bottom:8px;display:block}

/* ---------- verdict ---------- */
.verdict{margin:30px 0 0;border-radius:24px;border:1px solid var(--line2);overflow:hidden;background:var(--panel)}
.verdict-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:22px 26px}
.verdict-top .t{font-family:var(--display);font-size:24px}
.verdict-top .t small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}

      <p>Stranger still: the light from the Sun, spread out by a prism, has <strong>dark lines</strong> slashed through it at exactly the colours that elements glow. In 1868 astronomers found a line that matched no element on Earth. They named the mystery element after the Sun, <em>helios</em>: helium. It wasn’t found on Earth for another 27 years.</p>
      <p>Explaining those colours tore classical physics apart and gave birth to <strong>quantum mechanics</strong>. In this file you’ll follow light into the atom, find the electron living on a staircase, watch it dissolve into a cloud, and finally look into the nucleus, which sometimes simply falls apart.</p>`,
    cast: [['ph', 'happy'], ['e', 'sly'], ['Bo', 'happy'], ['Ra', 'sly'], ['q', 'sly']]
  },
  finale: {
    q: 'What rule hides inside every atom?', lead: 'Light in packets, colours like barcodes, electrons as clouds, shells that set personality, and a nucleus that decays at random. One strange rule ties them together.',
    avatar: 'q', nameHTML: 'The <em>quantum</em>',
    html: `<p>At the scale of atoms, <strong>energy comes in steps</strong>, not smooth slopes, and nature plays by probabilities, not certainties.</p>
      <p>Light arrives in packets (photons) whose energy depends on colour. Electrons can only sit on certain energy levels, so atoms emit and absorb only certain colours: their barcode. An electron doesn’t follow a path; it has a probability cloud. The way those levels fill up into shells gives every element its size and personality. And a radioactive nucleus decays at a random moment, yet a crowd of them keeps perfect time.</p>
      <p>Every glowing screen, every laser, every MRI scan and every carbon date rests on these rules. Case closed.</p>`
  },
  cases: [
    {
      short: 'Packets of Light', kicker: 'Light: waves & photons', titleHTML: 'Packets of <em>Light</em>', item: 'The sunburn', ico: 'sun', teaser: 'Why UV and not red?',
      clue: 'Light comes in packets called photons. Shorter wavelength means more energy per photon: E = hc/λ.',
      mystery: { q: 'A bright red lamp can shine on you all day without burning your skin, but a little ultraviolet from the Sun gives you sunburn. Why?', h: ['UV light is hotter', 'Each UV photon carries enough energy to damage a molecule; red photons don’t, however many there are', 'Skin reflects all red light'], a: 1, v: 'Light is delivered in <b>packets</b> (photons), and each one’s energy depends on its wavelength. A UV photon carries enough energy to break bonds in DNA in one hit. A red photon carries about half as much, and a billion weak packets can’t add up to one strong one. Damage is all-or-nothing, photon by photon.' },
      story: `<p>In 1666 a young Isaac Newton darkened his room, let a single beam of sunlight through a hole in the shutter, and split it with a prism into a rainbow. White light, he realised, is a mixture of colours.</p>
        <p>In 1801 Thomas Young showed that light behaves like a <strong>wave</strong>, with ripples that overlap and interfere like water waves. The distance between crests, the <strong>wavelength</strong>, sets the colour: about 700 nanometres for red, 400 for violet. Beyond violet lies invisible ultraviolet; beyond red, infrared.</p>
        <p>Then, in 1900, Max Planck found he could only explain the glow of hot objects by assuming energy is handed out in tiny lumps: <strong>quanta</strong>. In 1905 Albert Einstein went further. Light itself travels in packets, later called <strong>photons</strong>, each carrying energy <strong>E = hc/λ</strong>. The shorter the wavelength, the bigger the packet. That idea, not relativity, won him his Nobel Prize.</p>`,
      lab: {
        label: 'Spectrum explorer', title: 'Tune the wavelength',
        body: `<div class="lab-grid"><div><div class="stage" style="height:320px"><canvas class="c" aria-label="A light wave of adjustable wavelength and the electromagnetic spectrum"></canvas></div>
          <div class="slider-row" style="margin-top:14px"><label>Wavelength</label><input type="range" class="l" min="150" max="1000" value="650" aria-label="Wavelength in nanometres" style="--track:linear-gradient(90deg,#8a7bd8,#7a3cff 26%,#3f7be0 33%,#2fd06a 42%,#f4e04d 50%,#ff7b2a 57%,#e0193f 66%,#8a3a3a)"><span class="readout"><b class="lo"></b></span></div></div>
          <div class="side-panel"><div class="kv"><div><small>Region</small><b class="rg"></b></div><div><small>Frequency</small><b class="fq"></b></div><div><small>Photon energy</small><b class="en"></b></div><div><small>Per mole of photons</small><b class="km"></b></div></div><div class="info-card"><p class="t" style="margin:0;font-size:14.5px;color:var(--soft)"></p></div></div></div>`,
        init(root) {
          let l = 650; const c = $('.c', root);
          slider($('.l', root), v => { l = v; const E = 1240 / l, kj = 119627 / l, f = 3e8 / (l * 1e-9);
            const rg = l < 280 ? 'UV-C' : l < 315 ? 'UV-B' : l < 380 ? 'UV-A' : l <= 750 ? 'Visible' : 'Infrared';
            $('.lo', root).textContent = l + ' nm'; $('.rg', root).textContent = rg; $('.fq', root).innerHTML = fmt(f, 2) + ' Hz'; $('.en', root).textContent = E.toFixed(2) + ' eV'; $('.km', root).textContent = Math.round(kj) + ' kJ';
            $('.t', root).innerHTML = kj > 348 ? `<b style="color:var(--pink)">Bond-breaker.</b> A mole of these photons carries ${Math.round(kj)} kJ, more than the 348 kJ needed to snap a mole of carbon–carbon bonds. One photon can break one bond in your DNA. This is why UV burns.` : `<b style="color:var(--green)">Harmless packets.</b> ${Math.round(kj)} kJ per mole of photons is less than the 348 kJ/mol needed to break a C–C bond. Turning up the brightness sends <i>more</i> packets, not <i>bigger</i> ones. ${l > 750 ? 'Infrared mostly just jiggles molecules, so you feel it as warmth.' : 'Your eyes can detect these.'}`; });
          animate(c, (dt, t) => { const { ctx, w, h } = fit(c); ctx.clearRect(0, 0, w, h); const col = nmRGB(l), y0 = h * .38, A = h * .2, lam = l * .28;
            glow(ctx, w / 2, y0, w * .5, col, .25);
            ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.shadowColor = col; ctx.shadowBlur = 12; ctx.beginPath(); for (let x = 0; x <= w; x += 2) { const y = y0 + Math.sin((x / lam - t * 1.2) * TAU) * A; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); ctx.shadowBlur = 0;
            const x0 = 40, ph = ((t * 1.2) % 1); ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1; ctx.beginPath(); const cx = x0 + (ph * lam) % lam; ctx.moveTo(cx + lam * .25, y0 - A - 14); ctx.lineTo(cx + lam * 1.25, y0 - A - 14); ctx.stroke(); label(ctx, 'λ = ' + l + ' nm', cx + lam * .75, y0 - A - 20, { align: 'center', size: 11 });
            for (let i = 0; i < 6; i++) { const px = ((t * 160 + i * w / 6) % w); glow(ctx, px, y0 + Math.sin((px / lam - t * 1.2) * TAU) * A, 10 + 140 / l * 6, col, .9); }
            const L = 20, R = w - 20, sy = h - 46, X = v => L + (v - 150) / 850 * (R - L);
            for (let v = 150; v < 1000; v += 2) { ctx.fillStyle = v < 380 ? 'rgba(138,123,216,.35)' : v > 750 ? 'rgba(138,58,58,.45)' : nmRGB(v); ctx.fillRect(X(v), sy, X(v + 2) - X(v) + .5, 14); }
            [[265, 'UV'], [565, 'visible'], [875, 'infrared']].forEach(([v, s]) => label(ctx, s, X(v), sy + 30, { align: 'center', size: 10, color: '#c9c8dc' }));
            const xm = X(l); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(xm, sy - 2); ctx.lineTo(xm - 6, sy - 12); ctx.lineTo(xm + 6, sy - 12); ctx.fill(); label(ctx, '← more energy per photon', L, sy - 18, { size: 10, color: '#8f8eab' }); });
        }
      },
      dialogue: [['ph', 'happy', 'LUX · photon', '“I travel at 300,000 km per second and I never come in halves. Every one of me is a single parcel. Blue parcels are heavier-hitting than red ones.”'], ['e', 'sly', 'THE GHOST · electron', '“And when one of your parcels is exactly the right size, I swallow it whole. Remember that. It explains everything in this file.”']],
      lenses: ['A rainbow; the warmth of a heat lamp; a sunburn after a cloudy beach day.', 'Streams of photons, each a packet of energy. Ultraviolet packets are big enough to break chemical bonds; infrared ones only make molecules jiggle.', 'E = hc / λ', 'h = Planck’s constant (6.63 × 10⁻³⁴ J s); c = speed of light; λ = wavelength.'],
      miracle: { ico: 'eye', title: 'Your eyes can count single photons', html: '<p>The rod cells in your retina are so sensitive that one can respond to a <strong>single photon</strong>. A pigment molecule called rhodopsin absorbs the packet, flips its shape in a few trillionths of a second, and sets off a chain reaction that becomes a signal to your brain.</p><p>Experiments have shown people sitting in total darkness can sometimes report a flash that was a single photon. You are a quantum detector.</p>', c1: '#ffd36e', c2: '#a78bfa' },
      quiz: [
        { q: 'Which photon carries more energy?', o: ['A red photon (700 nm)', 'A blue photon (450 nm)', 'They carry the same', 'It depends on brightness'], a: 1, w: 'E = hc/λ: shorter wavelength means more energy per photon. Brightness changes how many photons arrive, not each one’s energy.' },
        { q: 'Turning up the brightness of a red lamp…', o: ['makes each photon more energetic', 'sends more photons, each with the same energy', 'changes its colour to blue', 'turns it into UV'], a: 1, w: 'More brightness means more packets per second. The size of each packet depends only on colour.' }
      ],
      prompt: { p: 'Explain why sunscreen focuses on blocking UV and not visible or infrared light.', m: 'Light comes in photons whose energy depends on wavelength. UV photons are energetic enough that a single one can break a chemical bond in skin molecules and DNA, causing burns and mutations. Visible and infrared photons each carry too little energy to break bonds; extra brightness only means more weak packets, which can warm you but not snap bonds.' }
    },
    {
      short: 'Fingerprints of Light', kicker: 'Spectra & the Bohr model', titleHTML: 'Fingerprints of <em>Light</em>', item: 'The starlight barcode', ico: 'star', teaser: 'How do we know?',
      clue: 'Electrons can only occupy fixed energy levels. When they drop between levels, they emit photons of exact colours: a unique barcode for each element.',
      mystery: { q: 'Nobody has ever visited a star. How do we know what stars are made of?', h: ['From meteorites that fall to Earth', 'Each element emits and absorbs its own unique set of colours, a barcode in the light', 'From the colour of the star as a whole'], a: 1, v: 'Spread starlight into a spectrum and you find dark lines at exact wavelengths: places where atoms in the star’s outer layers absorbed photons. Each element has a <b>unique set of lines</b>, because its electrons can only jump between its own fixed energy levels. Match the barcode and you know the element. Helium was found in the Sun this way, 27 years before it was found on Earth.' },
      story: `<p>In 1859 two friends in Heidelberg, chemist <strong>Robert Bunsen</strong> (of the burner) and physicist <strong>Gustav Kirchhoff</strong>, put elements into a clean flame and looked at the light through a prism. Each element gave a few sharp, bright <strong>lines</strong> of colour, never a smooth rainbow. Within two years they had used this trick to discover two new metals: <em>caesium</em>, named for its sky-blue lines, and <em>rubidium</em>, for its red ones.</p>
        <p>But why lines? In 1913 a young Dane, <strong>Niels Bohr</strong>, made a daring proposal. An electron in an atom can only sit on certain <strong>energy levels</strong>, like the steps of a staircase, never between them. To jump up it must swallow a photon of exactly the right energy. When it falls back down, it spits out a photon whose energy matches the drop exactly.</p>
        <p>Since each element has its own staircase, each emits its own set of colours. For hydrogen, Bohr’s steps are E = −13.6 eV ÷ n², and the drops onto step 2 give exactly the red, cyan, blue and violet lines that had puzzled scientists for decades.</p>`,
      lab: {
        label: 'The hydrogen staircase', title: 'Excite an electron, catch its light',
        head: '<div class="controls" style="margin:0"><button class="btn primary small zap">⚡ Excite</button><button class="btn small auto">Auto</button><button class="btn small ghost clr">Clear</button></div>',
        body: `<div class="stage" style="height:380px"><canvas class="c" aria-label="Hydrogen energy levels, an atom, and the spectrum of emitted lines"></canvas></div><p class="readout msg" style="margin-top:12px">Press <b>Excite</b>: the electron absorbs energy and jumps up, then falls back step by step, emitting photons.</p>`,
        init(root) {
          const c = $('.c', root), En = n => -13.6 / (n * n);
          let n = 1, target = 1, anim = 0, auto = false, wait = 0; const lines = {}; const photons = [];
          const zap = () => { if (n === 1 && anim === 0) { target = 2 + Math.floor(Math.random() * 5); anim = 1; wait = .5; } };
          $('.zap', root).addEventListener('click', zap);
          $('.auto', root).addEventListener('click', () => { auto = !auto; $('.auto', root).classList.toggle('on', auto); });
          $('.clr', root).addEventListener('click', () => { for (const k in lines) delete lines[k]; });
          animate(c, (dt, t) => {
            const { ctx, w, h } = fit(c); ctx.clearRect(0, 0, w, h);
            if (anim === 1) { n = target; anim = 2; wait = .7; } else if (anim === 2) { wait -= dt; if (wait <= 0) { if (n > 1) { const m = 1 + Math.floor(Math.random() * (n - 1)); const dE = En(n) - En(m), lam = 1240 / dE; const key = `${n}→${m}`; lines[key] = { lam, c: (lines[key] ? lines[key].c : 0) + 1 }; photons.push({ x: 0, y: 0, a: Math.random() * TAU, lam, life: 1.4 }); $('.msg', root).innerHTML = `n = ${n} → n = ${m}: ΔE = ${dE.toFixed(2)} eV → photon of <b style="color:${nmRGB(lam)}">${lam.toFixed(0)} nm</b> (${lam < 380 ? 'ultraviolet: Lyman series' : lam <= 750 ? 'visible: Balmer series' : 'infrared'}).`; n = m; wait = .55; } else { anim = 0; } } }
            if (auto && anim === 0) zap();
            const lw = Math.min(260, w * .3), ly0 = 30, ly1 = h - 110, Y = E => ly1 - Math.pow(1 + E / 13.6, 1.8) * (ly1 - ly0);
            for (let k = 1; k <= 6; k++) { const y = Y(En(k)); ctx.strokeStyle = k === n ? '#ffd36e' : 'rgba(255,255,255,.3)'; ctx.lineWidth = k === n ? 2.5 : 1; ctx.beginPath(); ctx.moveTo(30, y); ctx.lineTo(lw, y); ctx.stroke(); if (k <= 4) label(ctx, `n=${k}  ${En(k).toFixed(2)} eV`, 34, y - 5, { size: 10, color: k === n ? '#ffd36e' : '#8f8eab' }); }
            label(ctx, 'ENERGY LEVELS (spacing compressed)', 30, 16, { size: 10, color: '#8f8eab' });
            const ey = Y(En(n)); glow(ctx, lw - 30, ey, 18, '#5ce1e6', 1); ball(ctx, '#5ce1e6', lw - 30, ey, 6);
            const ax = lw + (w - lw) / 2, ay = (h - 90) / 2 + 6, sc = Math.min(w - lw, h - 100) / 2 / 38;
            for (let k = 1; k <= 6; k++) { ctx.strokeStyle = 'rgba(167,139,250,.35)'; ctx.setLineDash([2, 5]); ctx.beginPath(); ctx.arc(ax, ay, k * k * sc + 6, 0, TAU); ctx.stroke(); } ctx.setLineDash([]);
            glow(ctx, ax, ay, 22, '#ff5d5d', 1); ball(ctx, '#ff5d5d', ax, ay, 6);
            const ang = t * 3 / n; glow(ctx, ax + Math.cos(ang) * (n * n * sc + 6), ay + Math.sin(ang) * (n * n * sc + 6), 16, '#5ce1e6', 1); ball(ctx, '#5ce1e6', ax + Math.cos(ang) * (n * n * sc + 6), ay + Math.sin(ang) * (n * n * sc + 6), 4.5);
            for (const p of photons) { p.life -= dt; const d = (1.4 - p.life) * 220; const col = nmRGB(p.lam); glow(ctx, ax + Math.cos(p.a) * d, ay + Math.sin(p.a) * d, 22, col, Math.max(0, p.life)); }
            for (let i = photons.length - 1; i >= 0; i--) if (photons[i].life <= 0) photons.splice(i, 1);
            const L = 20, R = w - 20, sy = h - 50, X = v => L + (Math.log(v) - Math.log(90)) / (Math.log(2000) - Math.log(90)) * (R - L);
            ctx.fillStyle = '#05060d'; ctx.fillRect(L, sy, R - L, 26); ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.strokeRect(L, sy, R - L, 26);
            for (const k in lines) { const { lam, c: cnt } = lines[k], x = X(lam), col = nmRGB(lam); ctx.globalAlpha = Math.min(1, .35 + cnt * .15); ctx.fillStyle = col; ctx.fillRect(x - 1.5, sy, 3, 26); glow(ctx, x, sy + 13, 14, col, .7); ctx.globalAlpha = 1; label(ctx, lam.toFixed(0), x, sy + 40, { align: 'center', size: 9, color: '#8f8eab' }); }
            [[90, 380, 'UV · Lyman'], [380, 750, 'visible · Balmer'], [750, 2000, 'IR · Paschen…']].forEach(([a, b, s]) => label(ctx, s, (X(a) + X(b)) / 2, sy - 6, { align: 'center', size: 9.5, color: '#c9c8dc' }));
          });
        }
      },
      lenses: ['Old orange street lamps; a neon sign; the colour of salt sprinkled in a gas flame.', 'Electrons pushed up to higher energy levels fall back down, each drop releasing a photon whose energy exactly matches the gap.', 'ΔE = E<sub>high</sub> − E<sub>low</sub> = hc/λ', 'For hydrogen: E<sub>n</sub> = −13.6 eV / n². The drop from n=3 to n=2 gives 656 nm, a red line.'],
      miracle: { ico: 'bulb', title: 'Reading the air of other worlds', html: '<p>When a distant planet passes in front of its star, a little starlight shines through its atmosphere. The molecules there absorb their own barcode of wavelengths. In 2023 the James Webb Space Telescope read carbon dioxide and methane in the air of a planet 120 light-years away this way.</p><p>Same trick, closer to home: the sodium street lamps of the last century glowed at 589 nm, sodium’s brightest line, which is why they bathed whole cities in orange.</p>', c1: '#ffd36e', c2: '#ff9f5a' },
      quiz: [
        { q: 'Why does each element produce only certain colours of light (lines), not a full rainbow?', o: ['Elements filter out other colours', 'Its electrons can only drop between fixed energy levels, so only certain photon energies are possible', 'The flame is not hot enough', 'Prisms are imperfect'], a: 1, w: 'Fixed levels mean fixed energy gaps, and each gap corresponds to one wavelength of light.' },
        { q: 'An electron falls from a high level to a low level. What happens?', o: ['It absorbs a photon', 'It emits a photon whose energy equals the gap', 'The atom becomes an ion', 'Nothing: electrons never fall'], a: 1, w: 'Falling releases energy as a photon. Absorbing a photon of exactly the right energy pushes it back up.' }
      ],
      prompt: { p: 'Explain how an astronomer can tell there is sodium in a star, using the words "energy level" and "photon".', m: 'Sodium atoms have their own set of electron energy levels. When starlight passes through sodium atoms, electrons absorb photons whose energy exactly matches the gap between two levels (589 nm, yellow). That wavelength goes missing, leaving a dark line in the star’s spectrum. Since only sodium has gaps of exactly those sizes, the line pattern identifies it.' }
    },
    {
      short: 'Clouds, Not Orbits', kicker: 'Quantum orbitals', titleHTML: 'Clouds, Not <em>Orbits</em>', item: 'The electron’s address', ico: 'atom', teaser: 'Where is it, exactly?',
      clue: 'An electron doesn’t follow a path. It has an orbital: a cloud of probabilities showing where it is likely to be found (s spheres, p dumbbells, d clovers).',
      mystery: { q: 'Where exactly is the electron in a hydrogen atom, right now?', h: ['Circling the nucleus like a tiny planet', 'Nowhere definite: it only has probabilities of being found in different places', 'Resting on the surface of the nucleus'], a: 1, v: 'Quantum mechanics says the electron has <b>no definite position</b> until you measure it. Its whereabouts are described by an <b>orbital</b>: a cloud of probability. Measure many times and the dots build up the cloud’s shape. Bohr’s neat orbits were a brilliant stepping stone, but they were wrong in detail.' },
      story: `<p>Bohr’s staircase worked beautifully for hydrogen and failed for almost everything else. In 1924 a French prince studying physics, <strong>Louis de Broglie</strong>, suggested something outrageous: if light waves can act like particles, perhaps particles like electrons can act like <strong>waves</strong>. Experiments soon proved him right: electrons make interference patterns too.</p>
        <p>In 1926 <strong>Erwin Schrödinger</strong> wrote the equation for an electron-wave inside an atom. Its solutions, called <strong>orbitals</strong>, are not paths but <em>clouds of probability</em>. A year later <strong>Werner Heisenberg</strong> showed that you cannot know an electron’s exact position and exact speed at the same time. The fuzziness isn’t a weakness of our instruments; it is how nature is built.</p>
        <p>Orbitals come in shapes with letter names: <strong>s</strong> (spheres), <strong>p</strong> (dumbbells), <strong>d</strong> (four-leaf clovers). Some have <strong>nodes</strong>: surfaces where the electron is <em>never</em> found, even though it is found on both sides. Each orbital can hold at most two electrons.</p>`,
      lab: {
        label: 'Quantum camera', title: 'Measure the electron, again and again',
        head: '<div class="seg orb"></div>',
        body: `<div class="lab-grid"><div class="stage" style="height:400px"><canvas class="c" aria-label="Probability cloud of an electron orbital built from repeated measurements"></canvas></div><div class="side-panel"><div class="info-card"><div class="meta nm"></div><h4 class="tt"></h4><p class="d" style="margin:0;font-size:14.5px;color:var(--soft)"></p></div><div class="kv"><div><small>Measurements</small><b class="cnt">0</b></div><div><small>Nodes</small><b class="nd"></b></div></div><button class="btn small ghost rs">Clear & measure again</button></div></div>`,
        init(root) {
          const O = {
            '1s': [r => Math.exp(-2 * r), (x, y) => Math.exp(-Math.hypot(x, y)), 5, 0, 'A sphere, densest at the centre. The electron of hydrogen in its ground state lives here.'],
            '2s': [0, (x, y) => { const r = Math.hypot(x, y); return (2 - r) * Math.exp(-r / 2); }, 13, 1, 'A bigger sphere with a hollow shell inside it: a spherical node at r = 2 where the electron is never found.'],
            '2p': [0, (x, y) => { const r = Math.hypot(x, y); return x * Math.exp(-r / 2); }, 13, 1, 'A dumbbell with two lobes. Between them is a flat node through the nucleus. There are three 2p orbitals, along x, y and z.'],
            '3p': [0, (x, y) => { const r = Math.hypot(x, y); return x * (6 - r) * Math.exp(-r / 3); }, 24, 2, 'A dumbbell with extra inner lobes: one flat node plus one spherical node.'],
            '3d': [0, (x, y) => { const r = Math.hypot(x, y); return x * y * Math.exp(-r / 3); }, 24, 2, 'A four-leaf clover. d orbitals give transition metals like copper and iron their colours and magnetism.']
          };
          let cur = '1s', cnt = 0, max = 1; const c = $('.c', root), off = document.createElement('canvas'); let ow = 0, oh = 0;
          function setO(k) { cur = k; cnt = 0; const f = O[k][1], E = O[k][2]; max = 0; for (let i = 0; i < 120; i++) for (let j = 0; j < 120; j++) { const v = f(-E + 2 * E * i / 119, -E + 2 * E * j / 119); max = Math.max(max, v * v); } if (ow) off.getContext('2d').clearRect(0, 0, ow, oh);
            $('.nm', root).textContent = `ORBITAL ${k}`; $('.tt', root).textContent = { s: 's orbital', p: 'p orbital', d: 'd orbital' }[k[1]]; $('.d', root).textContent = O[k][4]; $('.nd', root).textContent = O[k][3]; }
          seg($('.orb', root), Object.keys(O).map(k => [k, k]), cur, setO); setO('1s');
          $('.rs', root).addEventListener('click', () => setO(cur));
          animate(c, (dt, t) => { const { ctx, w, h } = fit(c); if (w !== ow || h !== oh) { ow = w; oh = h; off.width = w; off.height = h; cnt = 0; } const oc = off.getContext('2d');
            const f = O[cur][1], E = O[cur][2], S = Math.min(w, h) / 2 / E * .95;
            if (cnt < 26000) for (let i = 0; i < 1600; i++) { const x = (Math.random() * 2 - 1) * E, y = (Math.random() * 2 - 1) * E, v = f(x, y); if (Math.random() * max < v * v) { cnt++; oc.fillStyle = v >= 0 ? 'rgba(92,225,230,.55)' : 'rgba(255,107,154,.55)'; oc.fillRect(w / 2 + x * S, h / 2 + y * S, 1.4, 1.4); } }
            ctx.clearRect(0, 0, w, h); ctx.drawImage(off, 0, 0, w, h); glow(ctx, w / 2, h / 2, 12, '#f4c35a', 1); ball(ctx, '#ffdf9a', w / 2, h / 2, 2.5);
            label(ctx, 'each dot = one measurement of the electron’s position', 12, h - 12, { size: 10, color: '#8f8eab' }); if (cur !== '1s' && cur !== '2s') { label(ctx, 'cyan / pink = opposite wave phases', 12, 18, { size: 10, color: '#8f8eab' }); }
            $('.cnt', root).textContent = cnt.toLocaleString('en'); });
        }

function flashcards() {
  const CARDS = COURSE.cards, DAY = 864e5, INT = [0, 0, 1, 3, 7, 30];
  let deck = store.get('deck', {}); const card = $('#fc'), rate = $('#fc-rate'), sel = $('#fc-filter');
  let queue = [], curr = null, filter = 'all', cram = false;
  sel.innerHTML = `<option value="all">All case files (${CARDS.length} cards)</option>` + CASES.map((c, i) => `<option value="${i + 1}">File ${i + 1}: ${c.short} (${CARDS.filter(x => x[0] === i + 1).length})</option>`).join('');
  const st = i => deck[i] || { box: 1, due: 0 }, inF = i => filter === 'all' || CARDS[i][0] == filter;
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  function build() { queue = shuffle(CARDS.map((_, i) => i).filter(i => inF(i) && (cram || st(i).due <= Date.now()))); next(); }
  function boxes() {
    const counts = [0, 0, 0, 0, 0]; CARDS.forEach((_, i) => { if (inF(i)) counts[st(i).box - 1]++; }); const mx = Math.max(1, ...counts);
    $('#fc-boxes').innerHTML = counts.map((c, i) => `<div><span>${c}</span><i style="height:${c / mx * 80 + 2}%"></i><span>Box ${i + 1}</span></div>`).join('');
    const due = CARDS.filter((_, i) => st(i).due <= Date.now()).length; $('#due-badge').textContent = due; $('#due-badge').style.display = due ? '' : 'none';
  }
  function next() {
    card.classList.remove('flipped'); rate.classList.remove('show'); boxes();
    if (!queue.length) { curr = null; $('#fc-tag').textContent = 'All caught up'; $('#fc-box').textContent = ''; $('#fc-q').innerHTML = cram ? 'Cram session complete. Nicely done.' : 'No cards due right now. Come back tomorrow: the gap is what makes it stick.'; $('#fc-a').innerHTML = 'Spacing beats cramming.'; $('#fc-status').textContent = 'Nothing due'; return; }
    curr = queue[0]; const C = CARDS[curr];
    $('#fc-tag').textContent = `File ${C[0]} · ${CASES[C[0] - 1].short}`; $('#fc-box').textContent = `BOX ${st(curr).box}`;
    setTimeout(() => { $('#fc-q').innerHTML = C[1]; $('#fc-a').innerHTML = C[2]; }, card.dataset.was ? 250 : 0); card.dataset.was = 1;
    $('#fc-status').textContent = `${queue.length} card${queue.length > 1 ? 's' : ''} left in this session`;
  }
  function flip() { if (curr == null) return; card.classList.toggle('flipped'); if (card.classList.contains('flipped')) rate.classList.add('show'); }
  function grade(g) {
    if (curr == null || !card.classList.contains('flipped')) return;
    let box = st(curr).box, due;
    if (g === 1) { box = 1; due = Date.now(); } else if (g === 2) due = Date.now() + Math.max(6e5, INT[box] * DAY / 2); else { box = Math.min(5, box + 1); due = Date.now() + INT[box] * DAY; }
    deck[curr] = { box, due }; store.set('deck', deck); queue.shift(); if (g === 1) queue.splice(Math.min(queue.length, 3), 0, curr); next();
  }
  card.addEventListener('click', flip); card.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
  document.addEventListener('keydown', e => { const a = document.activeElement; if (a !== card && !rate.contains(a)) return; if (['1', '2', '3'].includes(e.key)) grade(+e.key); });
  rate.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { grade(+b.dataset.r); card.focus({ preventScroll: true }); } });
  sel.addEventListener('change', () => { filter = sel.value; cram = false; build(); });
  $('#fc-cram').addEventListener('click', () => { cram = true; build(); });
  $('#fc-resetdeck').addEventListener('click', () => { if (!confirm('Reset all flashcard progress for this course?')) return; deck = {}; store.set('deck', deck); cram = false; build(); });
  build();
}
function interrogation() {
  const box = $('#fi'), B = bank(); let qs = [], i = 0, log = [];

function hero() {
  const c = $('#hero-canvas'), rnd = seeded(+COURSE.id), A = COURSE.accent || ['#5ce1e6', '#f4c35a'];
  const cols = [A[0], A[1], '#ff6b9a', '#a78bfa', '#6fe3a0', '#dfe9ff'];
  const Pt = Array.from({ length: 64 }, (_, i) => ({ x: rnd(), y: rnd(), z: .25 + rnd() * .75, vx: (rnd() - .5) * .012, vy: (rnd() - .5) * .012, c: cols[i % cols.length], ph: rnd() * TAU }));
  let mx = -9999, my = -9999; const hs = $('.hero');
  hs.addEventListener('pointermove', e => { const r = c.getBoundingClientRect(); mx = e.clientX - r.left; my = e.clientY - r.top; });
  hs.addEventListener('pointerleave', () => { mx = my = -9999; });
  animate(c, (dt, t) => {
    const { ctx, w, h } = fit(c); ctx.clearRect(0, 0, w, h);
    const cx = w * .5, cy = h * .47, R = Math.min(w * .46, h * .42);
    glow(ctx, cx, cy, R * .5, A[1], .55); glow(ctx, cx, cy, R * .18, shade(A[1], .4), .9);

      for (let j = 1; j < 18; j++) { const aj = a - j * .035; ctx.fillStyle = rgba(A[0], .25 * (1 - j / 18)); ctx.beginPath(); ctx.arc(Math.cos(aj) * R, Math.sin(aj) * R * .3, 3 * (1 - j / 22), 0, TAU); ctx.fill(); }
      glow(ctx, ex, ey, 26, A[0], 1); ball(ctx, A[0], ex, ey, 5); ctx.restore();
    }
    for (const p of Pt) {
      if (!reduceMotion) { p.x += p.vx * dt * p.z; p.y += p.vy * dt * p.z; }
